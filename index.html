<!DOCTYPE html>
<html lang="en">
<head>

  <style>

















* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --mlb-blue: #002D72;
  --mlb-red: #E4002B;
  --mlb-dark: #041E42;
  --mlb-nav: #002147;
  --link-blue: #0056b3;
  --bg: #f4f4f4;
  --white: #fff;
  --border: #ddd;
  --border-light: #eee;
  --text: #1a1a1a;
  --text-secondary: #555;
  --text-muted: #888;
  --row-alt: #f9fbfd;
  --row-hover: #edf2f7;
}

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--mlb-dark);
  color: var(--white);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 200;
}

header h1 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.3px;
  text-transform: none;
}

/* ── Nav ── */
nav {
  background: var(--mlb-blue);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  position: sticky;
  top: 56px;
  z-index: 199;
  border-bottom: 3px solid var(--mlb-red);
}

nav a {
  color: rgba(255,255,255,.75);
  text-decoration: none;
  padding: 11px 20px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  text-transform: none;
  letter-spacing: .5px;
  border-bottom: 3px solid transparent;
  margin-bottom: -3px;
  transition: color .15s, border-color .15s;
}

nav a:hover { color: var(--white); }
nav a.active {
  color: var(--white);
  border-bottom-color: var(--white);
}

/* ── Scores ticker ── */
.scores-ticker {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  display: flex;
  gap: 0;
  padding: 0;
}

.ticker-game {
  min-width: 180px;
  padding: 10px 16px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
  cursor: pointer;
  transition: background .15s;
}

.ticker-game:hover { background: var(--row-hover); }
.ticker-game:last-child { border-right: none; }

.ticker-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-secondary);
}

.ticker-row.winner { color: var(--text); font-weight: 700; }
.ticker-score { font-weight: 700; font-size: 14px; min-width: 20px; text-align: right; }
.ticker-label { font-size: 10px; color: var(--text-muted); letter-spacing: .5px; text-align: center; padding-top: 2px; }

/* ── Main container ── */
#app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* ── Cards ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 24px;
  overflow: hidden;
}

.card-header {
  background: var(--white);
  color: var(--mlb-blue);
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 800;
  text-transform: none;
  letter-spacing: .3px;
  border-bottom: 2px solid var(--mlb-blue);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-body { padding: 0; }
.card-body.padded { padding: 20px; }
.card-body.padded p { margin: 0 0 14px 0; }
.card-body.padded p:last-child { margin-bottom: 0; }
.card-body.padded p strong { color: var(--mlb-dark); }

/* ── Tables ── */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: var(--mlb-blue);
  color: var(--white);
  font-weight: 600;
  font-size: 11px;
  text-align: left;
  text-transform: none;
  letter-spacing: .5px;
  padding: 10px 12px;
  white-space: nowrap;
  cursor: default;
  user-select: none;
  border-bottom: none;
}

th.sortable { cursor: pointer; }
th.sortable:hover { background: #003a8c; }
th.sort-asc::after { content: ' \25B2'; font-size: 9px; }
th.sort-desc::after { content: ' \25BC'; font-size: 9px; }

th.num, td.num { text-align: right; }

td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
}

tbody tr:nth-child(even) td { background: var(--row-alt); }
tbody tr:hover td { background: var(--row-hover); }

tr.totals td {
  font-weight: 700;
  border-top: 2px solid var(--mlb-blue);
  background: #edf2f7;
}

/* ── Links ── */
a.player-link, a.team-link, a.game-link {
  color: var(--link-blue);
  text-decoration: none;
  font-weight: 600;
}

a.player-link:hover, a.team-link:hover, a.game-link:hover {
  color: var(--mlb-red);
  text-decoration: underline;
}

/* ── Score boxes (schedule & box score pages) ── */
.score-box {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-light);
  transition: background .1s;
}

.score-box:hover { background: var(--row-hover); }
.score-box:last-child { border-bottom: none; }
.score-box .teams { flex: 1; }

.score-box .team-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 14px;
  color: var(--text-secondary);
}

.score-box .team-row.winner { font-weight: 700; color: var(--text); }
.score-box .score { font-weight: 800; min-width: 28px; text-align: right; font-size: 16px; }
.record-inline { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
.score-box .week-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: .5px;
  font-weight: 700;
  margin-right: 12px;
  min-width: 50px;
}

.box-link {
  font-size: 12px;
  color: var(--white);
  background: var(--mlb-blue);
  text-decoration: none;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 4px;
  text-transform: none;
  letter-spacing: .5px;
  transition: background .15s;
}

.box-link:hover { background: var(--mlb-red); text-decoration: none; }

/* ── Leaders ── */
.leaders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0;
  padding: 0;
}

.leader-cat {
  padding: 16px 20px;
  border-right: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
}

.leader-cat h4 {
  font-size: 11px;
  text-transform: none;
  letter-spacing: .8px;
  color: var(--mlb-blue);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--mlb-red);
  font-weight: 800;
}

.leader-cat .leader-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
}

.leader-cat .leader-item .val {
  font-weight: 800;
  color: var(--mlb-blue);
  font-size: 14px;
}

/* ── Bye label ── */
.bye-label {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-light);
  background: var(--row-alt);
}

/* ── Back link ── */
.back-link {
  display: inline-flex;
  align-items: center;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--link-blue);
  text-decoration: none;
  text-transform: none;
  letter-spacing: .3px;
}

.back-link:hover { color: var(--mlb-red); }

/* ── Page titles ── */
.page-title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--mlb-dark);
}

.page-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

/* ── Team page hero ── */
.team-hero {
  background: linear-gradient(135deg, var(--mlb-dark), var(--mlb-blue));
  color: var(--white);
  padding: 32px 28px;
  border-radius: 8px;
  margin-bottom: 24px;
}

.team-hero .page-title { color: var(--white); font-size: 32px; }
.team-hero .page-subtitle { color: rgba(255,255,255,.7); margin-bottom: 0; }

.team-hero .record-big {
  font-size: 22px;
  font-weight: 800;
  margin-top: 4px;
  color: rgba(255,255,255,.9);
}

/* ── Player page hero ── */
.player-hero {
  background: linear-gradient(135deg, var(--mlb-dark), var(--mlb-blue));
  color: var(--white);
  padding: 28px;
  border-radius: 8px;
  margin-bottom: 24px;
}

.player-hero .page-title { color: var(--white); font-size: 28px; }
.player-hero .page-subtitle { color: rgba(255,255,255,.7); margin-bottom: 0; }
.player-hero .page-subtitle a { color: rgba(255,255,255,.85); }
.player-hero .page-subtitle a:hover { color: var(--white); }

/* ── Box score header ── */
.boxscore-header {
  background: var(--mlb-dark);
  color: var(--white);
  border-radius: 8px;
  padding: 20px 28px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 32px;
}

.boxscore-header .matchup { flex: 1; }

.boxscore-header .matchup-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 18px;
}

.boxscore-header .matchup-row a { color: rgba(255,255,255,.75); font-size: 18px; }
.boxscore-header .matchup-row.winner a { color: var(--white); }
.boxscore-header .matchup-score { font-weight: 800; font-size: 24px; color: var(--white); }
.boxscore-header .matchup-row.winner .matchup-score { color: var(--white); }

.boxscore-header .game-meta {
  font-size: 11px;
  color: rgba(255,255,255,.5);
  text-transform: none;
  letter-spacing: .5px;
}

/* ── Layout ── */
.two-col {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: 24px;
}

@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
  .leaders-grid { grid-template-columns: 1fr 1fr; }
  nav a { padding: 10px 14px; font-size: 11px; }
  #app { padding: 16px; }
  header { padding: 0 16px; }
  .team-hero, .player-hero, .boxscore-header { padding: 20px; border-radius: 0; }
}

@media (max-width: 600px) {
  .leaders-grid { grid-template-columns: 1fr; }
  header h1 { font-size: 16px; }
  table { font-size: 12px; }
  th, td { padding: 7px 8px; }
  .page-title { font-size: 22px; }
  .boxscore-header .matchup-row { font-size: 15px; }
  .boxscore-header .matchup-score { font-size: 20px; }
}

  
/* Season selector */
.season-select {
  background: rgba(255,255,255,.15);
  color: rgba(255,255,255,.55);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  margin-left: 14px;
  cursor: pointer;
  outline: none;
}
.season-select:hover { background: rgba(255,255,255,.25); }
.season-select option { color: #333; background: white; }

.prev-season-table { opacity: 0.85; }
.prev-season-label {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding: 4px 0;
}

let DATA = null;
let SEASONS = window.INLINE_SEASONS;
let currentSeason = 'spring-2026';

const SEASON_LABELS = {
  'spring-2026': 'Spring 2026',
  'fall-2025': 'Fall 2025',
  'spring-2025': 'Spring 2025',
  'fall-2024': 'Fall 2024',
  'spring-2024': 'Spring 2024',
  'spring-2023': 'Spring 2023',
};

const NAV_ITEMS = [
  { hash: '#/', label: 'Standings' },
  { hash: '#/schedule', label: 'Schedule' },

function switchSeason(seasonId) {
  currentSeason = seasonId;
  DATA = SEASONS[currentSeason];
  document.getElementById('season-picker').value = seasonId;
  const url = new URL(location.href);
  url.searchParams.set('season', seasonId);
  history.replaceState(null, '', url.toString());
  router();
}

function calcAVG(h, ab) { return ab === 0 ? '.000' : (h / ab).toFixed(3).replace(/^0/, ''); }

function calcSLG(s) {
  if (s.AB === 0) return '.000';
  const singles = s.H - s.D - s.T - s.HR;
  const tb = singles + 2 * s.D + 3 * s.T + 4 * s.HR;
  return (tb / s.AB).toFixed(3).replace(/^0/, '');
}

function calcOBP(s) {
  const denom = s.PA;
  if (denom === 0) return '.000';
  return ((s.H + s.BB) / denom).toFixed(3).replace(/^0/, '');
}

function calcOPS(s) {
  const obp = s.PA === 0 ? 0 : (s.H + s.BB) / s.PA;
  const singles = s.H - s.D - s.T - s.HR;
  const tb = singles + 2 * s.D + 3 * s.T + 4 * s.HR;
  const slg = s.AB === 0 ? 0 : tb / s.AB;
  return (obp + slg).toFixed(3).replace(/^0/, '');
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m, 10) - 1] + ' ' + parseInt(day, 10);
}

function displayName(name) {
  if (name.includes(', ')) { const [last, first] = name.split(', '); return first + ' ' + last; }
  return name;
}

function getTeam(id) { return DATA.teams.find(t => t.id === id); }
function getPlayer(id) { return DATA.players.find(p => p.id === id); }
function getTeamPlayers(teamId) { return DATA.players.filter(p => p.teamId === teamId); }
function getTeamGames(teamId) { return DATA.games.filter(g => g.homeTeamId === teamId || g.awayTeamId === teamId); }

// Find same player across all seasons by ID
function findPlayerAcrossSeasons(playerId) {
  const results = [];
  for (const [seasonId, seasonData] of Object.entries(SEASONS)) {
    const p = seasonData.players.find(pl => pl.id === playerId);
    if (p) {
      const team = seasonData.teams.find(t => t.id === p.teamId);
      results.push({ seasonId, seasonLabel: SEASON_LABELS[seasonId], player: p, team });
    }
  }
  return results;
}

}

    </a>`;
  }).join('');
}

function sortableTable(id, data, columns, defaultSort, defaultDir) {
  let sortCol = defaultSort || columns[0].key;
  let sortDir = defaultDir || 'desc';

  function render() {
    const sorted = [...data].sort((a, b) => {
      let va = typeof columns.find(c => c.key === sortCol).val === 'function'
        ? columns.find(c => c.key === sortCol).val(a) : a[sortCol];
      let vb = typeof columns.find(c => c.key === sortCol).val === 'function'
        ? columns.find(c => c.key === sortCol).val(b) : b[sortCol];
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    const thead = columns.map(c => {
      const cls = [c.num ? 'num' : '', 'sortable', sortCol === c.key ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : ''].filter(Boolean).join(' ');
      return `<th class="${cls}" data-col="${c.key}">${c.label}</th>`;
    }).join('');

    const tbody = sorted.map(row => {
      return '<tr>' + columns.map(c => {
        const val = typeof c.render === 'function' ? c.render(row) : (typeof c.val === 'function' ? c.val(row) : row[c.key]);
        return `<td class="${c.num ? 'num' : ''}">${val}</td>`;
      }).join('') + '</tr>';
    }).join('');

    document.getElementById(id).innerHTML = `<div class="table-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;

    document.querySelectorAll(`#${id} th.sortable`).forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortCol = col; sortDir = 'desc'; }
        render();
      });
    });
  }
  render();
}

function pctDisplay(w, l, t) {
  const games = w + l + t;
  if (games === 0) return '.000';
  return ((w + t * 0.5) / games).toFixed(3).replace(/^0/, '');
}

function viewStandings() {
  const teams = DATA.teams.map(t => {
    const tp = getTeamPlayers(t.id);
    const sum = (key) => tp.reduce((s, p) => s + p.seasonStats[key], 0);
    const ab = sum('AB'), h = sum('H'), bb = sum('BB'), pa = sum('PA');
    const d = sum('D'), tr = sum('T'), hr = sum('HR');
    const singles = h - d - tr - hr;
    const tb = singles + 2*d + 3*tr + 4*hr;
    const slg = ab === 0 ? 0 : tb / ab;
    const obp = pa === 0 ? 0 : (h + bb) / pa;
    return {
      ...t,
      gp: t.wins + t.losses + t.ties,
      pct: parseFloat(pctDisplay(t.wins, t.losses, t.ties)),
      rs: DATA.games.reduce((s, g) => {
        if (g.homeTeamId === t.id) return s + g.homeScore;
        if (g.awayTeamId === t.id) return s + g.awayScore;
        return s;
      }, 0),
      ra: DATA.games.reduce((s, g) => {
        if (g.homeTeamId === t.id) return s + g.awayScore;
        if (g.awayTeamId === t.id) return s + g.homeScore;
        return s;
      }, 0),
      tAB: ab, tH: h, tR: sum('R'), tHR: hr, tBB: bb, tBI: sum('BI'), tE: sum('E'),
      tD: d, tT: tr,
      tAVG: ab === 0 ? 0 : h / ab,
      tSLG: slg,
      tOPS: obp + slg,
    };
  }).sort((a, b) => b.pct - a.pct || b.wins - a.wins || a.losses - b.losses);

  const fmtR = (v) => v.toFixed(3).replace(/^0/, '');

  // League leaders

  const leaders = {

    'Hits': DATA.players.map(p => ({ p, v: p.seasonStats.H })).sort((a, b) => b.v - a.v).slice(0, 5),
    'Runs': DATA.players.map(p => ({ p, v: p.seasonStats.R })).sort((a, b) => b.v - a.v).slice(0, 5),
    'RBI': DATA.players.map(p => ({ p, v: p.seasonStats.BI })).sort((a, b) => b.v - a.v).slice(0, 5),
    'OPS': qualified.map(p => ({ p, v: parseFloat(calcOPS(p.seasonStats)) })).sort((a, b) => b.v - a.v).slice(0, 5),
    'Doubles': DATA.players.map(p => ({ p, v: p.seasonStats.D })).filter(i => i.v > 0).sort((a, b) => b.v - a.v).slice(0, 5),
    'Triples': DATA.players.map(p => ({ p, v: p.seasonStats.T })).filter(i => i.v > 0).sort((a, b) => b.v - a.v).slice(0, 5),
    'Home Runs': DATA.players.map(p => ({ p, v: p.seasonStats.HR })).filter(i => i.v > 0).sort((a, b) => b.v - a.v).slice(0, 5),

function ordinal(n) {
  if (typeof n === 'string') return n;
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function playerRankings(player) {
  const all = DATA.players;
  function rank(sortFn) {
    const sorted = [...all].sort(sortFn);
    const idx = sorted.findIndex(p => p.id === player.id);
    return ordinal(idx + 1);
  }
  const cats = [
    rank((a, b) => b.seasonStats.H - a.seasonStats.H),
    rank((a, b) => {
      const aa = a.seasonStats.AB === 0 ? 0 : a.seasonStats.H / a.seasonStats.AB;
      const bb = b.seasonStats.AB === 0 ? 0 : b.seasonStats.H / b.seasonStats.AB;
      return bb - aa;
    }),
    rank((a, b) => b.seasonStats.R - a.seasonStats.R),
    rank((a, b) => b.seasonStats.D - a.seasonStats.D),
    rank((a, b) => b.seasonStats.T - a.seasonStats.T),
    rank((a, b) => b.seasonStats.HR - a.seasonStats.HR),
    rank((a, b) => b.seasonStats.BB - a.seasonStats.BB),
    rank((a, b) => b.seasonStats.SF - a.seasonStats.SF),
  ];
  return cats.map(r => `<td class="num">${r}</td>`).join('');
}

        <td class="num">${ps.BB}</td><td class="num">${ps.SF}</td><td class="num">${ps.BI}</td><td class="num">${ps.E}</td>
        <td class="num">${calcAVG(ps.H, ps.AB)}</td>
      </tr>`;
    }).join('');

    return `<div class="card">
      <div class="card-header">${teamName}</div>
      <div class="card-body"><div class="table-wrap">
        <table><thead><tr>
          <th>Player</th><th class="num">PA</th><th class="num">AB</th><th class="num">H</th><th class="num">R</th>
          <th class="num">2B</th><th class="num">3B</th><th class="num">HR</th><th class="num">BB</th><th class="num">SF</th>
          <th class="num">RBI</th><th class="num">E</th><th class="num">AVG</th>
        </tr></thead>
        <tbody>${rows}
          <tr class="totals">
            <td>Totals</td>
            <td class="num">${totals.PA}</td><td class="num">${totals.AB}</td><td class="num">${totals.H}</td><td class="num">${totals.R}</td>
            <td class="num">${totals.D}</td><td class="num">${totals.T}</td><td class="num">${totals.HR}</td>
            <td class="num">${totals.BB}</td><td class="num">${totals.SF}</td><td class="num">${totals.BI}</td><td class="num">${totals.E}</td>
            <td class="num">${calcAVG(totals.H, totals.AB)}</td>
          </tr>
        </tbody></table>
      </div></div>
    </div>`;
  }

  const hw = game.homeScore > game.awayScore;

  const GAME_RECAPS = {
    'week1-game1': `<p><strong>Franklin 14, St. Catherines 15</strong> &mdash; In the season opener, Franklin came within a single run of upsetting the hottest team in the league, falling 14-15 to St. Catherines in a back-and-forth slugfest at Bayside Park.</p>

<p>St. Catherines came out swinging, racking up 24 hits across their 13-man lineup. Matt Barr set the tone, going 3-for-3 with 3 runs scored and a double, while Anthony DeLosSantos matched him at 3-for-3 with a game-high 4 RBI. Jerry Ng also went a perfect 3-for-3 at the top of the order. Incredibly, 10 of St. Catherines' 13 batters recorded at least one hit &mdash; the kind of lineup depth that powered their transformation from an 0-9-1 team in Spring 2024 to early title contenders this season.</p>

<p>But Franklin matched them blow for blow. Todd Lanam, Uland Wong, and Mu Jing each went a perfect 4-for-4, combining for 12 of Franklin's 24 hits. Jason Sosnick added 2 hits and a team-high 3 RBI, and Ryan Pierce delivered a 2-for-3 line that included both a double and a triple, driving in 3 runs. Mike Rokovich added a triple of his own. Every single Franklin batter recorded at least one hit &mdash; all 11 players who stepped to the plate got on base.</p>

<p>The final margin came down to one swing. St. Catherines' Paul Besse quietly went 2-for-3 with 3 RBI, and Joe Bandel added 2 hits and 2 RBI &mdash; the kind of middle-of-the-order production that kept the Saints just ahead despite Franklin's furious hitting.</p>

<p><strong>The takeaway:</strong> This was as encouraging a loss as Franklin could have. A team that went 0-10 just three seasons ago put up 24 hits and 14 runs against a legitimate contender. St. Catherines is hitting .724 as a team this season, and Franklin went toe-to-toe with them. The difference wasn't talent &mdash; it was one run. If this game is any indication, the Franklin rebuild is real.</p>`,

    'week1-game2': `<p><strong>Lincoln Lions 8, Burlingame Expansion 3</strong> &mdash; Lincoln opened Spring 2026 with a commanding 8-3 victory over Burlingame Expansion, a balanced lineup attack that left the Expansion's new-look roster looking outmatched from the start.</p>

<p>Chris Lau was the story for Lincoln, going a perfect 3-for-3 with 2 runs scored and a pair of doubles &mdash; he didn't make a single out all game. Mike Benveniste drove in a team-high 3 runs while going 2-for-3, and Peter Ou added 2 hits and 2 RBI from the bottom of the order. Barlow Gilmore (2-for-3, double, RBI), Arjun Moorthy (2-for-3, RBI), and Kenny Kim (2-for-3, double) each had multi-hit games to round out one of the deeper Lincoln lineups in recent memory. Nine of Lincoln's 13 batters recorded at least one hit &mdash; the kind of top-to-bottom production that's nearly impossible to contain.</p>

<p>Jack Maguire was the lone Expansion bright spot, going 3-for-3 and accounting for all 3 of his team's RBI. His individual performance masked how thoroughly Lincoln controlled the game &mdash; the rest of the Expansion lineup went 6-for-26, with 7 different batters going hitless. For a team that went 1-9 last fall after losing most of their Spring 2025 championship core, the transition pains are real.</p>

<p><strong>The takeaway:</strong> Lincoln looks like a legitimate title contender. A 13-man lineup with no obvious holes and consistent production up and down the order is exactly the kind of team that wins championships. Burlingame Expansion, meanwhile, faces a long road back to their 2025 form.</p>`,

    'week1-game3': `<p><strong>Hoover 17, McKinley 2 2</strong> &mdash; Hoover made short work of expansion team McKinley 2 in the season opener, rolling to a 17-2 victory behind a relentless lineup that collected 19 hits and had nine of ten starters reach base at least once.</p>

<p>Phillip Koblis set the pace at the top of the order, going 3-for-4 with 4 runs scored and a double &mdash; the most runs in any single Hoover lineup spot. Sean Lowenthal followed with 2 hits and a game-high 4 RBI, and Adam Ramirez added a double, 3 RBI, and 2 runs scored from the middle of the order. Levon Stepanian (2-for-4, 2 RBI), Jim Szafranski (2-for-4, 3 runs), Sunil Koshie (2-for-4, RBI), and Chris Cohendet (2 runs, 2 RBI) all contributed in a lineup with no weak spots. Hoover's nine multi-hit contributors combined for 19 hits with power scattered throughout.</p>

<p>McKinley 2, in just their second week as an expansion franchise, showed the growing pains expected of a first-year squad. David Conti (2-for-2) and Sanjiv Parikh (2-for-2, double) were the lone bright spots in a lineup that managed just 8 hits. Three errors behind them only compounded the damage, giving Hoover extra opportunities they certainly didn't need.</p>

<p><strong>The takeaway:</strong> Hoover arrives in Spring 2026 as one of the teams to beat. The same core that upset Franklin in the Fall 2025 playoffs is back and hitting with the same authority. McKinley 2 will need time to build chemistry, but working through games against top competition is exactly the kind of experience that accelerates development.</p>`,

    'week1-game4': `<p><strong>Washington Wildkittens 14, Carey 13</strong> &mdash; In the most electrifying game of Week 1, Washington Wildkittens escaped with a 14-13 victory over Carey in a back-and-forth slugfest that went down to the final out. The two teams combined for 37 hits and 27 runs in a game that could have gone either way.</p>

<p>Chris Geheran was the hero for Washington, delivering a clutch 3-for-4 afternoon with a double, a triple, and a game-high 6 RBI &mdash; exactly the kind of middle-of-the-order production that swings one-run games. Brian Roth (3-for-4, 3 runs, double), Darryl Saifher (3-for-4, 2 runs, 3 RBI), and Darren Miles (2-for-4, 3 runs, 2 RBI, 2 doubles) each had multi-hit games, and Bill Poucher added 2 hits and an RBI. Six different Wildkittens recorded multiple hits, leaving Carey's pitching with nowhere to hide.</p>

<p>But Carey absolutely refused to roll over. Marc Acton (3-for-3, 3 runs, double) and Ryan Batenchuck (3-for-3, 3 runs, RBI, 2 doubles) both went perfect at the plate to ignite the Carey attack. Chris Coleman drove in 3 runs, Travis Barabin added 3 RBI including a double, and David Williams came through with 2 RBI on 2 hits. Carey scattered 17 hits across 15 batters and only Geheran's 6-RBI masterpiece prevented them from taking the opener.</p>

<p><strong>The takeaway:</strong> Both teams showed they can hit &mdash; 37 combined hits is staggering offense. Washington gets the win and the 1-0 start, but Carey's lineup is far more dangerous than their record might eventually suggest. These two could be in similar spots in the standings when they meet again.</p>`,

    'week2-game1': `<p><strong>St. Catherines 25, McKinley 2 0</strong> &mdash; There are blowouts, and then there are historically dominant performances. St. Catherines' 25-0 shutout of McKinley 2 in Week 2 fell firmly in the latter category &mdash; a relentless, lineup-wide demolition that had every Saint reaching base and McKinley held off the scoreboard entirely.</p>

<p>Paul Besse headlined what may be the most complete team performance of the young season, going 3-for-3 with 3 runs, 5 RBI, and 2 triples. Mo Tancilau went 3-for-3 with 2 doubles and 2 RBI, Matt Germino went a perfect 3-for-3 with 3 runs scored, and Ray Malaspina added 3 hits and 3 runs. Joe Bandel drove in 4 runs on 2 hits, James Lin had 3 RBI on 2 hits with a double, and Jerry Ng added a double and an RBI on his 2-for-2 night. Art Wong, Danny Bahamondes, and Ricky Gomez each had 2 hits and multiple runs scored. The number that tells the full story: all 15 St. Catherines batters reached base at least once. There were no weak spots, no free outs, no escape.</p>

<p>McKinley 2 managed just 2 hits in the game &mdash; Brandon Wright and Sanjiv Parikh each singled &mdash; and couldn't push a run across despite those base runners. The shutout was emphatic and, given the talent gap, probably inevitable.</p>

<p><strong>The takeaway:</strong> St. Catherines has now scored 40 runs in two weeks and hasn't lost a game. This is a lineup that can put up crooked numbers against anyone, and they're showing no signs of slowing down. For McKinley 2, the growing pains continue &mdash; but every game against a team this good builds character and shows what the standard looks like.</p>`,

    'week2-game3': `<p><strong>Hoover 15, Washington Wildkittens 14</strong> &mdash; For the second consecutive week, a Hoover game was decided by a single run. The two-time playoff contenders held off Washington Wildkittens 15-14 in a 45-hit slugfest that featured lead changes, clutch performances on both sides, and no shortage of drama in the late innings.</p>

<p>Marc Snyder delivered the signature line of the game, going a perfect 4-for-4 with a triple, 3 RBI, and 2 runs scored &mdash; the only player on either team to go 4-for-4. Cayman Seacrest blasted a home run and a double on his 3-for-4 night, driving in 3 runs and scoring twice. Phillip Koblis (3-for-4, 2 doubles, 2 RBI), Bryan Dow (3-for-4, double, 2 RBI), and Fred Fabor (3-for-4, 2 runs) were relentless at the plate. Colin Bryant added 3 hits and 2 RBI, and every single Hoover starter recorded at least one hit &mdash; this was a total team effort when the game was on the line.</p>

<p>Washington pushed Hoover to the absolute limit. Gareth Adams produced the most jaw-dropping line of the afternoon: 3-for-4 with a triple and 5 RBI, single-handedly keeping Washington in contention through the final inning. Josh Mello (3-for-4, double, 3 RBI) and Drew Simmons (3-for-4, 2 runs) each had 3 hits of their own, and Kentaro Matsurra drew 2 walks and scored twice in a disciplined performance. Washington's 19 hits and 14 runs would win most games. They just ran into the one team that couldn't be outscored.</p>

<p><strong>The takeaway:</strong> Hoover is 2-0 with two one-run wins &mdash; the hallmark of a team that knows how to close. Washington is 1-1 and proved they can hang with anyone. When these two meet again, it could easily be the most competitive game of the season.</p>`,

    'week2-game4': `<p><strong>Lincoln Lions 8, Roosevelt Blue 6</strong> &mdash; Lincoln Lions made it back-to-back wins to open Spring 2026, holding off a scrappy Roosevelt Blue squad 8-6 in a tighter contest than their Week 1 blowout suggested. The Lions showed they could grind out a close game when the offense didn't come as easily.</p>

<p>The contributions came from across the lineup. Mike Benveniste (2-for-3, 2 runs, RBI) and Francisco Martinez (1-for-3, 2 runs, 2 RBI, double) anchored the middle of the order with the production Lincoln needed to stay ahead. Alan Ching and Peter Ou, coming in late in the lineup, combined to go 4-for-4 with 2 runs and an RBI between them &mdash; exactly the kind of bottom-of-the-order depth that separates good teams from great ones. Barlow Gilmore, Brett Reynolds, and Chris Lau each added an RBI, spreading the run production across seven different Lions.</p>

<p>Roosevelt Blue made it interesting. Ankush Bhargava was the story, driving in 3 runs on just 1 hit &mdash; a clutch performance when his team needed runs. David Vinca (2-for-3, 2 runs) and Nick Adler (2-for-3, 1 run) provided the on-base presence, and Joe Carvillo scored twice. But Roosevelt left too many runners stranded and couldn't string together the back-to-back hits needed to erase the deficit in the final innings.</p>

<p><strong>The takeaway:</strong> Lincoln is 2-0 and looking like one of the most complete teams in the league. The depth of their lineup &mdash; seven different RBI contributors tonight &mdash; makes them difficult to pitch around from top to bottom. Roosevelt Blue at 0-2 needs to find some early-inning momentum before the hole becomes too deep to climb out of.</p>`,

    'week2-game2': `<p><strong>Franklin 20, Carey 8</strong> &mdash; If the Week 1 loss to St. Catherines was a statement of legitimacy, Week 2 was a statement of dominance. Franklin hammered out 27 hits and 20 runs in a comprehensive dismantling of Carey, picking up their first win of the Spring 2026 season.</p>

<p>Ryan Pierce was the player of the game, going a perfect 4-for-4 with 2 doubles, 3 runs scored, and a team-high 4 RBI. Pierce has now started the season 6-for-7 (.857) with 4 extra-base hits &mdash; a scorching pace that matches any hitter in the league. But the real headliner was Jonah VanZandt, who crushed 2 triples on a 3-for-4 night with 3 runs scored and a game-high 5 RBI. The 2 triples were vintage VanZandt, who now has 3 career three-baggers and a knack for finding the gaps.</p>

<p>The lineup was relentless from top to bottom. Steven Jefferson went 4-for-4, Todd Lanam went 3-for-4 with 2 doubles (giving him 3 doubles through 2 games), and Robby Samuelson added 3 hits and 2 RBI. Jason Sosnick chipped in 2 hits including a double, and Uland Wong went 2-for-4 with another double. For the second consecutive game, every single Franklin batter recorded at least one hit &mdash; an 11-for-11 contribution rate that speaks to the remarkable depth of this lineup.</p>

<p>Carey, playing their second game with a largely overhauled roster after losing their entire Spring 2025 championship core, showed flashes of potential. Marc Acton went 2-for-3 with 2 runs, and Pudge Colaco drove in a run with a triple. But with 6 brand-new-to-the-league players still finding their footing, the defending champs simply couldn't keep up with Franklin's onslaught &mdash; 8 of their 17 batters went hitless.</p>

<p><strong>The takeaway:</strong> Through two games, Franklin is hitting .607 as a team with 51 hits in 84 at-bats. They've scored 34 runs and have an 11-for-11 hit contribution rate in both games. For context, this franchise went 0-10 in Spring 2023, 0-10 in Fall 2024, and just 1-8 in Spring 2025. The current core &mdash; fully assembled since Fall 2025 when they went 5-6 &mdash; is now playing like a genuine contender. The bats are real, and the league is on notice.</p>`,

    'fall25-game8': `<p><strong>Franklin 35, Roosevelt Blue 10</strong> &mdash; Franklin opened the Fall 2025 season with a thunderous statement, pounding out 43 hits and 35 runs in an emphatic rout of Roosevelt Blue at Bayside Park.</p>

<p>This was offense from another dimension. Every single Franklin batter had at least 2 hits, led by Todd Lanam who went a perfect 6-for-6 with 5 runs scored and 2 doubles. Jason Sosnick was right behind at 5-for-6 with 4 runs and 2 doubles of his own, while Robby Samuelson went 5-for-5 with 5 runs and 5 RBI. Jonah VanZandt added 5 hits including a double, and Steven Jefferson drove in 5 runs on a 4-for-6 night that included a double and a triple.</p>

<p>Mike Rokovich anchored the middle of the lineup with 4 hits and 5 RBI, while Mu Jing (4-for-6, 4 runs) and Alex Liu (4-for-5, 4 RBI including a double) made their presence felt. Even Mario Linge, the last batter in the order, drove in 3 runs. The 43-hit, 35-run explosion was a franchise record by any measure.</p>

<p>Roosevelt Blue, to their credit, managed 10 runs behind Nick Adler's 3-for-3 night with 2 triples and 4 RBI, and Brian Chang's 3-for-3 outing. But they were overwhelmed from the start by a Franklin lineup that simply refused to make an out.</p>

<p><strong>The takeaway:</strong> This wasn't just a win &mdash; it was a declaration. Coming off a 2-8 Spring 2025, Franklin entered the fall with their core fully intact for the first time and immediately showed what this roster was capable of. The 35 runs set a tone that would carry through the entire season.</p>`,

    'fall25-game9': `<p><strong>Franklin 5, Burlingame Expansion 19</strong> &mdash; The high of the season opener came crashing down in Week 2, as Burlingame Expansion &mdash; the reigning Spring 2025 runners-up &mdash; handed Franklin a humbling 5-19 defeat.</p>

<p>The story of this game was one man: Jack Maguire. Burlingame Expansion's slugger went 4-for-4 with an astonishing 3 home runs and 10 RBI, single-handedly outscoring the entire Franklin team. Christian Kohn added 3 hits with 2 doubles and a triple, and Dean Wilson reached base all 4 times with 2 hits, 2 walks, and 4 runs scored. Burlingame's lineup was simply overpowering.</p>

<p>Franklin managed 15 hits but couldn't string them together when it mattered. Nate Lawler led with 3-for-3 including a double, and Sosnick had a triple in his 2-for-3 game. Jing went 2-for-2 with a double. But 5 runs was never going to be enough against a Burlingame team that was firing on all cylinders.</p>

<p><strong>The takeaway:</strong> A reality check after the 35-run opener. Burlingame Expansion was one of the league's best teams, and Maguire's 3-homer game was the kind of individual performance that can't be game-planned away. Franklin would need to find a way to compete with the top tier &mdash; a challenge that would define the rest of their season.</p>`,

    'fall25-game13': `<p><strong>Franklin 12, BHS 16</strong> &mdash; In a hard-fought battle against the undefeated league leaders, Franklin put up a strong fight before falling 12-16 to BHS in a game that was closer than the final score suggests.</p>

<p>Franklin came out swinging. Lanam went 4-for-4 with 3 runs scored, and Nate Lawler matched him at 4-for-4 with a triple and 2 RBI. VanZandt was perfect at 3-for-3. The Falcons racked up 21 hits and 12 runs &mdash; enough to win most games.</p>

<p>But BHS was relentless. Ron Johnstone set the pace at 4-for-4 with a double, a triple, and 4 runs. Ryan Aguilar (3-for-3 with a triple) and Ken Heller (3-for-4 with a triple and 3 RBI) provided the firepower, while Prentice Ng drove in 3 with a perfect 3-for-3 night. BHS hit .615 as a team and simply outhit Franklin at every turn.</p>

<p><strong>The takeaway:</strong> This was the kind of loss that builds confidence. Franklin went toe-to-toe with the best team in the league and put up 12 runs. The 21 hits showed the offense was no fluke. BHS would finish the season 10-0 &mdash; and this was one of their tighter games. Franklin was proving they belonged in the conversation.</p>`,

    'fall25-game18': `<p><strong>Franklin 7, St. Catherines 40</strong> &mdash; There are no other words for it: this was a shellacking. St. Catherines erupted for 40 runs on what seemed like an endless barrage of hits, handing Franklin the most lopsided loss of their season.</p>

<p>The Saints were otherworldly. Ray Malaspina went 5-for-5 with 5 runs and 5 RBI, including 2 doubles. Paul Besse matched him at 5-for-5 with 5 runs and a staggering 8 RBI, adding 2 doubles and a triple. Joe Bandel (4-for-4, 5 runs, 4 RBI), Andrew Phu (4-for-4, 4 runs, 5 RBI with a double and a home run), and Mo Tancilau (4-for-4, 3 runs, a double) all feasted. It was a lineup performing at a level rarely seen in this league.</p>

<p>Franklin managed 13 hits and 7 runs &mdash; a respectable offensive output on any normal night. Ed LaGory led with 3-for-3 and 2 runs. Sosnick went 2-for-2 with a walk and scored, while Rokovich drove in 3 with a 2-for-3 line that included a triple. But when the other team hangs 40, nothing is enough.</p>

<p><strong>The takeaway:</strong> Sometimes you just run into a buzzsaw. St. Catherines was on a historic tear, and this was the game where everything clicked for them. For Franklin, the key was not letting this kind of blowout define the season. The true test would be how they responded.</p>`,

    'fall25-game22': `<p><strong>Franklin 24, Washington Wildkittens 4</strong> &mdash; Franklin responded to the 40-run loss to St. Catherines in the best way possible: a 24-4 demolition of Washington Wildkittens that showed this team's resilience.</p>

<p>The offense was balanced and devastating. Lanam (4-for-4, double), Sosnick (4-for-4, double, 3 RBI), VanZandt (3-for-3, double, triple, 2 RBI), and Jing (3-for-3, double, 4 RBI) led the charge, but the entire lineup contributed. Rokovich drove in 4 runs on 2 hits including a double and a triple, while Pierce (2-for-3, 3 RBI) and Lawler (2-for-4, double, triple, 3 RBI) provided extra-base pop throughout. Nine different Franklin players drove in at least one run.</p>

<p>Washington managed just 7 hits, with Kentaro Matsurra (2-for-2, 2 runs) and Matt Frantz (2-for-2) providing the bulk of their offense. Collin Woo did drive in 3 runs, but the Wildkittens were overmatched from the first inning.</p>

<p><strong>The takeaway:</strong> Bounce-back games reveal character, and this was a statement from Franklin. After being embarrassed 7-40, the Falcons came out and put up 24 runs of their own. The 26-hit attack featured 10 extra-base hits &mdash; doubles and triples scattered throughout the lineup. This team was not going to fold.</p>`,

    'fall25-game27': `<p><strong>Franklin 10, BIS 19</strong> &mdash; Franklin dropped their fourth loss of the season as BIS's deep lineup proved too much, outgunning the Falcons 19-10 in a game where both teams swung freely.</p>

<p>Franklin hit the ball well, collecting 18 hits. Lanam (3-for-4, double), Sosnick (3-for-4, 3 RBI), and Jing (3-for-4) each had multi-hit games. Pierce added 2 hits with a double, and Rokovich drove in 3 with a double in his 2-for-3 night. Samuelson also contributed 3 RBI on a 1-for-3 line with a walk.</p>

<p>But BIS was simply overpowering. Kevin Lemire led off with a 4-for-5 game and scored 4 runs. Miky Kuo went 4-for-4 with 2 triples and 4 RBI, and Tony Delucchi was 4-for-4 with 3 RBI. BIS piled up hits across the board, and Franklin couldn't keep pace despite a solid offensive effort.</p>

<p><strong>The takeaway:</strong> Another case of Franklin hitting well enough to win &mdash; 18 hits and 10 runs &mdash; but being outclassed in run prevention. The pattern was becoming clear: Franklin could match most teams offensively, but their Achilles' heel was giving up big innings to potent lineups.</p>`,

    'fall25-game31': `<p><strong>Franklin 15, Lincoln Lions 11</strong> &mdash; In a crucial mid-season matchup, Franklin outlasted Lincoln 15-11 in a game that showcased the Falcons' balanced attack and ability to win a slugfest.</p>

<p>Lanam was magnificent, going 4-for-5 with a double, 3 RBI, and 2 runs scored. Nate Lawler stepped up huge with 3-for-4, a double, 3 RBI, and 3 runs scored. Uland Wong had perhaps the best all-around game, going 3-for-4 with a double, a triple, and 2 RBI. Samuelson was steady at 3-for-4 as well, and even Mu Jing &mdash; despite going 1-for-3 &mdash; scored 3 runs and drove in one, working a walk to keep rallies alive.</p>

<p>Lincoln didn't go quietly. Paul Huck (3-for-3, triple, 3 RBI) and Elliot Katz (2-for-3, triple, home run) provided the power, while Barlow Gilmore (2-for-3, triple, 2 RBI) and Brett Reynolds (2-for-3, triple) kept the pressure on. Lincoln had 5 triples and a home run in the game &mdash; they were hitting for serious extra-base power.</p>

<p><strong>The takeaway:</strong> This was Franklin's most important win of the season to this point. Lincoln was a team in their tier, and beating them 15-11 in a game where both teams hit well showed that Franklin could close out a competitive contest. The 10 different Franklin batters who recorded hits demonstrated the lineup depth that would become this team's calling card. This would also prove to be a key preview of a potential Spring 2026 matchup.</p>`,

    'fall25-game36': `<p><strong>Franklin 6, Hoover 21</strong> &mdash; Hoover's lineup erupted for 21 runs, and Franklin had no answers in their most lopsided loss since the St. Catherines debacle.</p>

<p>Hoover was dominant from top to bottom. Cayman Seacrest (4-for-4, double, 4 runs), Chris Cohendet (4-for-4, 2 doubles, 5 RBI), and Marc Snyder (3-for-4, home run, 4 RBI) anchored a lineup that seemed to hit every pitch Franklin threw. Fred Fabor and Colin Bryant each added 3 hits.</p>

<p>Franklin mustered just 15 hits and struggled to drive runners in. Rokovich was the bright spot, going 3-for-3 with a double, a triple, and an RBI. Lanam, Samuelson, VanZandt, and Linge each had 2 hits, but the Falcons scored just 6 runs on those 15 hits &mdash; a stark contrast to their usual offensive efficiency. Ryan Pierce (0-for-4) and Nate Lawler (0-for-4) were both blanked, a rare off night for two of the team's key bats.</p>

<p><strong>The takeaway:</strong> The loss dropped Franklin to 3-5, and the pattern continued: Franklin could hit with anyone, but when they faced a top-tier offense, they gave up too many runs to keep pace. The 15-hit, 6-run disconnect was frustrating &mdash; this team needed to find a way to convert hits into runs more efficiently.</p>`,

    'fall25-game38': `<p><strong>Fall 2025 Playoff Game &mdash; Franklin 12, Burlingame Expansion 10</strong> &mdash; Sweet revenge, on the biggest stage. After being crushed 5-19 by Burlingame Expansion in the regular season, Franklin flipped the script in the playoffs, rallying for a hard-fought 12-10 victory to advance in the postseason bracket.</p>

<p>Mike Rokovich delivered the signature playoff moment of Franklin's season, going 4-for-4 with a walk, a home run, 5 RBI, and 4 runs scored &mdash; an all-time performance when it mattered most. It was Rokovich's first career home run, and he picked the perfect time to hit it: a win-or-go-home playoff game against the team that had embarrassed them earlier in the year. Samuelson backed him up at 4-for-5 with 2 runs scored, and Lanam added 3 hits.</p>

<p>Uland Wong (3-for-4, 2 RBI) and Jing (3-for-4) provided key contributions, and the entire lineup chipped in with 24 hits as a team. Burlingame fought hard &mdash; Steve Murphy (3-for-4, double), Vic Gallant (3-for-4, 2 triples, 2 RBI), and the dangerous Jack Maguire (2-for-2 with a walk) all contributed &mdash; but Franklin held on in the kind of tight, gutsy victory that defines a playoff team.</p>

<p><strong>The takeaway:</strong> This was the game that announced Franklin had arrived. Beating the team that blew you out 19-5 &mdash; in the playoffs, no less &mdash; is the kind of revenge narrative that defines franchise turnarounds. Rokovich's breakout homer was the exclamation point on a statement win. For a franchise that went 0-10 and 1-8-1 in prior seasons, winning a playoff game was uncharted territory. Franklin wasn't just competitive anymore &mdash; they were a postseason team, and this victory set up a deeper run through the bracket.</p>`,

    'fall25-game42': `<p><strong>Fall 2025 Playoff Game &mdash; Franklin 11, BIS 8</strong> &mdash; In a win-or-go-home playoff matchup, Franklin gutted out an 11-8 victory over BIS to keep their postseason alive. This was the game that punched Franklin's ticket to the championship &mdash; and the Falcons played like a team that belonged.</p>

function viewAllPlayers() {

    const s = p.seasonStats;
    const team = getTeam(p.teamId);
    return {
      id: p.id, name: p.name, teamId: p.teamId, teamName: team ? team.name : '',
      G: s.G, PA: s.PA, AB: s.AB, H: s.H, R: s.R, D: s.D, T: s.T, HR: s.HR, BB: s.BB, SF: s.SF, BI: s.BI, E: s.E,
      AVG: parseFloat(calcAVG(s.H, s.AB)),
      SLG: parseFloat(calcSLG(s)),
      OPS: parseFloat(calcOPS(s)),

  const cols = [

    { key: 'G', label: 'G', num: true, val: r => r.G },
    { key: 'PA', label: 'PA', num: true, val: r => r.PA },
    { key: 'AB', label: 'AB', num: true, val: r => r.AB },
    { key: 'H', label: 'H', num: true, val: r => r.H },
    { key: 'R', label: 'R', num: true, val: r => r.R },
    { key: 'D', label: '2B', num: true, val: r => r.D },
    { key: 'T', label: '3B', num: true, val: r => r.T },
    { key: 'HR', label: 'HR', num: true, val: r => r.HR },
    { key: 'BB', label: 'BB', num: true, val: r => r.BB },
    { key: 'SF', label: 'SF', num: true, val: r => r.SF },

  sortableTable('all-players-table', rows, cols, 'AVG', 'desc');

function viewSchedule(scrollToWeek) {
  const weeks = {};
  DATA.games.forEach(g => {
    if (!weeks[g.week]) weeks[g.week] = { games: [], date: g.date };
    weeks[g.week].games.push(g);
  });

  // Build cumulative records: before each game, what is each team's W-L-T?
  const sortedWeeks = Object.keys(weeks).map(Number).sort((a, b) => a - b);
  const recordBeforeGame = {}; // gameId -> teamId -> {w, l, t}
  const cumulative = {};
  DATA.teams.forEach(t => { cumulative[t.id] = { w: 0, l: 0, t: 0 }; });
  sortedWeeks.forEach(wk => {
    weeks[wk].games.forEach(g => {
      if (!cumulative[g.homeTeamId]) cumulative[g.homeTeamId] = { w: 0, l: 0, t: 0 };
      if (!cumulative[g.awayTeamId]) cumulative[g.awayTeamId] = { w: 0, l: 0, t: 0 };
      recordBeforeGame[g.id] = {
        [g.homeTeamId]: { ...cumulative[g.homeTeamId] },
        [g.awayTeamId]: { ...cumulative[g.awayTeamId] },
      };
      if (g.homeScore > g.awayScore) {
        cumulative[g.homeTeamId].w++;
        cumulative[g.awayTeamId].l++;
      } else if (g.awayScore > g.homeScore) {
        cumulative[g.awayTeamId].w++;
        cumulative[g.homeTeamId].l++;
      } else {
        cumulative[g.homeTeamId].t++;
        cumulative[g.awayTeamId].t++;
      }
    });
  });

  function fmtRecord(r) {
    return r.t > 0 ? `(${r.w}-${r.l}-${r.t})` : `(${r.w}-${r.l})`;
  }

  // Determine byes
  const byes = {};
  Object.entries(weeks).forEach(([wk, w]) => {
    const teamsPlaying = new Set();
    w.games.forEach(g => { teamsPlaying.add(g.homeTeamId); teamsPlaying.add(g.awayTeamId); });
    DATA.teams.forEach(t => {
      if (!teamsPlaying.has(t.id)) {
        if (!byes[wk]) byes[wk] = [];
        byes[wk].push(t);
      }
    });
  });

  const html = Object.entries(weeks).sort((a, b) => a[0] - b[0]).map(([wk, w]) => {
    const gamesHtml = w.games.map(g => {
      const home = getTeam(g.homeTeamId);
      const away = getTeam(g.awayTeamId);
      if (!home || !away) return '';
      const hw = g.homeScore > g.awayScore;
      const hasBox = g.homeStats || g.awayStats;
      const awayRec = recordBeforeGame[g.id] && recordBeforeGame[g.id][away.id] ? fmtRecord(recordBeforeGame[g.id][away.id]) : '';
      const homeRec = recordBeforeGame[g.id] && recordBeforeGame[g.id][home.id] ? fmtRecord(recordBeforeGame[g.id][home.id]) : '';
      const clickable = hasBox ? `onclick="if(event.target.closest('a')===null)location.hash='#/game/${g.id}'" style="cursor:pointer"` : '';
      return `<div class="score-box" ${clickable}>
        <div class="teams">
          <div class="team-row ${!hw ? 'winner' : ''}"><span class="team-name-rec"><a class="team-link" href="#/team/${away.id}">${away.name}</a> <span class="record-inline">${awayRec}</span></span><span class="score">${g.awayScore}</span></div>
          <div class="team-row ${hw ? 'winner' : ''}"><span class="team-name-rec"><a class="team-link" href="#/team/${home.id}">${home.name}</a> <span class="record-inline">${homeRec}</span></span><span class="score">${g.homeScore}</span></div>
        </div>
      </div>`;
    }).join('');

    const byeHtml = byes[wk] ? `<div class="bye-label">BYE: ${byes[wk].map(t => t.name).join(', ')}</div>` : '';

    return `<div class="card" id="week-${wk}">
      <div class="card-header">Week ${wk} &mdash; ${fmtDate(w.date)}</div>
      <div class="card-body">${gamesHtml}${byeHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="page-title">Schedule</div>
    <div class="page-subtitle">All games by week</div>
    ${html}
  `;
  if (scrollToWeek) {
    setTimeout(() => {
      const el = document.getElementById('week-' + scrollToWeek);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }
}

function router() {
  window.scrollTo(0, 0);
  const hash = location.hash || '#/';
  renderNav();
  renderTicker();

  if (hash.startsWith('#/team/')) {
    viewTeam(hash.replace('#/team/', ''));
  } else if (hash.startsWith('#/player/')) {
    viewPlayer(hash.replace('#/player/', ''));
  } else if (hash.startsWith('#/game/')) {
    viewBoxScore(hash.replace('#/game/', ''));
  } else if (hash === '#/players') {
    viewAllPlayers();
  } else if (hash.startsWith('#/schedule')) {
    const weekMatch = hash.match(/#\/schedule\/week\/(\d+)/);
    viewSchedule(weekMatch ? parseInt(weekMatch[1]) : null);
  } else {
    viewStandings();
  }
}

function init() {
  const urlSeason = new URLSearchParams(location.search).get('season');
  if (urlSeason && SEASONS[urlSeason]) {
    currentSeason = urlSeason;
  }
  DATA = SEASONS[currentSeason];
  document.getElementById('season-picker').value = currentSeason;
  const subtitleEl = document.getElementById('season-subtitle'); if (subtitleEl) subtitleEl.textContent = 'Burlingame · ' + SEASON_LABELS[currentSeason];
  window.addEventListener('hashchange', router);
  router();
}

init();
