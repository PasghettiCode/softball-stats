<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burlingame Dad's American League - Spring 2026</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --mlb-blue: #002D72;
  --mlb-red: #E4002B;
  --mlb-dark: #041E42;
  --mlb-nav: #002147;
  --link-blue: #0056b3;
  --bg: #f4f4f4;
  --white: #fff;
  --border: #ddd;
  --border-light: #eee;
  --text: #1a1a1a;
  --text-secondary: #555;
  --text-muted: #888;
  --row-alt: #f9fbfd;
  --row-hover: #edf2f7;
}

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--mlb-dark);
  color: var(--white);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 200;
}

header h1 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.3px;
  text-transform: none;
}

header .subtitle {
  font-size: 11px;
  color: rgba(255,255,255,.55);
  margin-left: 14px;
  font-weight: 500;
  letter-spacing: .5px;
  text-transform: none;
  align-self: center;
}

/* ── Nav ── */
nav {
  background: var(--mlb-blue);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  position: sticky;
  top: 56px;
  z-index: 199;
  border-bottom: 3px solid var(--mlb-red);
}

nav a {
  color: rgba(255,255,255,.75);
  text-decoration: none;
  padding: 11px 20px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  text-transform: none;
  letter-spacing: .5px;
  border-bottom: 3px solid transparent;
  margin-bottom: -3px;
  transition: color .15s, border-color .15s;
}

nav a:hover { color: var(--white); }
nav a.active {
  color: var(--white);
  border-bottom-color: var(--white);
}

/* ── Scores ticker ── */
.scores-ticker {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  display: flex;
  gap: 0;
  padding: 0;
}

.ticker-game {
  min-width: 180px;
  padding: 10px 16px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
  cursor: pointer;
  transition: background .15s;
}

.ticker-game:hover { background: var(--row-hover); }
.ticker-game:last-child { border-right: none; }

.ticker-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-secondary);
}

.ticker-row.winner { color: var(--text); font-weight: 700; }
.ticker-score { font-weight: 700; font-size: 14px; min-width: 20px; text-align: right; }
.ticker-label { font-size: 10px; color: var(--text-muted); letter-spacing: .5px; text-align: center; padding-top: 2px; }

/* ── Main container ── */
#app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* ── Cards ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 24px;
  overflow: hidden;
}

.card-header {
  background: var(--white);
  color: var(--mlb-blue);
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 800;
  text-transform: none;
  letter-spacing: .3px;
  border-bottom: 2px solid var(--mlb-blue);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-body { padding: 0; }
.card-body.padded { padding: 20px; }

/* ── Tables ── */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: var(--mlb-blue);
  color: var(--white);
  font-weight: 600;
  font-size: 11px;
  text-align: left;
  text-transform: none;
  letter-spacing: .5px;
  padding: 10px 12px;
  white-space: nowrap;
  cursor: default;
  user-select: none;
  border-bottom: none;
}

th.sortable { cursor: pointer; }
th.sortable:hover { background: #003a8c; }
th.sort-asc::after { content: ' \25B2'; font-size: 9px; }
th.sort-desc::after { content: ' \25BC'; font-size: 9px; }

th.num, td.num { text-align: right; }

td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
}

tbody tr:nth-child(even) td { background: var(--row-alt); }
tbody tr:hover td { background: var(--row-hover); }

tr.totals td {
  font-weight: 700;
  border-top: 2px solid var(--mlb-blue);
  background: #edf2f7;
}

/* ── Links ── */
a.player-link, a.team-link, a.game-link {
  color: var(--link-blue);
  text-decoration: none;
  font-weight: 600;
}

a.player-link:hover, a.team-link:hover, a.game-link:hover {
  color: var(--mlb-red);
  text-decoration: underline;
}

/* ── Score boxes (schedule & box score pages) ── */
.score-box {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-light);
  transition: background .1s;
}

.score-box:hover { background: var(--row-hover); }
.score-box:last-child { border-bottom: none; }
.score-box .teams { flex: 1; }

.score-box .team-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 14px;
  color: var(--text-secondary);
}

.score-box .team-row.winner { font-weight: 700; color: var(--text); }
.score-box .score { font-weight: 800; min-width: 28px; text-align: right; font-size: 16px; }
.score-box .week-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: .5px;
  font-weight: 700;
  margin-right: 12px;
  min-width: 50px;
}

.box-link {
  font-size: 12px;
  color: var(--white);
  background: var(--mlb-blue);
  text-decoration: none;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 4px;
  text-transform: none;
  letter-spacing: .5px;
  transition: background .15s;
}

.box-link:hover { background: var(--mlb-red); text-decoration: none; }

/* ── Leaders ── */
.leaders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0;
  padding: 0;
}

.leader-cat {
  padding: 16px 20px;
  border-right: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
}

.leader-cat h4 {
  font-size: 11px;
  text-transform: none;
  letter-spacing: .8px;
  color: var(--mlb-blue);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--mlb-red);
  font-weight: 800;
}

.leader-cat .leader-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
}

.leader-cat .leader-item .val {
  font-weight: 800;
  color: var(--mlb-blue);
  font-size: 14px;
}

/* ── Bye label ── */
.bye-label {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-light);
  background: var(--row-alt);
}

/* ── Back link ── */
.back-link {
  display: inline-flex;
  align-items: center;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--link-blue);
  text-decoration: none;
  text-transform: none;
  letter-spacing: .3px;
}

.back-link:hover { color: var(--mlb-red); }

/* ── Page titles ── */
.page-title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--mlb-dark);
}

.page-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

/* ── Team page hero ── */
.team-hero {
  background: linear-gradient(135deg, var(--mlb-dark), var(--mlb-blue));
  color: var(--white);
  padding: 32px 28px;
  border-radius: 8px;
  margin-bottom: 24px;
}

.team-hero .page-title { color: var(--white); font-size: 32px; }
.team-hero .page-subtitle { color: rgba(255,255,255,.7); margin-bottom: 0; }

.team-hero .record-big {
  font-size: 22px;
  font-weight: 800;
  margin-top: 4px;
  color: rgba(255,255,255,.9);
}

/* ── Player page hero ── */
.player-hero {
  background: linear-gradient(135deg, var(--mlb-dark), var(--mlb-blue));
  color: var(--white);
  padding: 28px;
  border-radius: 8px;
  margin-bottom: 24px;
}

.player-hero .page-title { color: var(--white); font-size: 28px; }
.player-hero .page-subtitle { color: rgba(255,255,255,.7); margin-bottom: 0; }
.player-hero .page-subtitle a { color: rgba(255,255,255,.85); }
.player-hero .page-subtitle a:hover { color: var(--white); }

/* ── Box score header ── */
.boxscore-header {
  background: var(--mlb-dark);
  color: var(--white);
  border-radius: 8px;
  padding: 20px 28px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 32px;
}

.boxscore-header .matchup { flex: 1; }

.boxscore-header .matchup-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 18px;
}

.boxscore-header .matchup-row a { color: rgba(255,255,255,.75); font-size: 18px; }
.boxscore-header .matchup-row.winner a { color: var(--white); }
.boxscore-header .matchup-score { font-weight: 800; font-size: 24px; color: var(--white); }
.boxscore-header .matchup-row.winner .matchup-score { color: var(--white); }

.boxscore-header .game-meta {
  font-size: 11px;
  color: rgba(255,255,255,.5);
  text-transform: none;
  letter-spacing: .5px;
}

/* ── Layout ── */
.two-col {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: 24px;
}

@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
  .leaders-grid { grid-template-columns: 1fr 1fr; }
  nav a { padding: 10px 14px; font-size: 11px; }
  #app { padding: 16px; }
  header { padding: 0 16px; }
  .team-hero, .player-hero, .boxscore-header { padding: 20px; border-radius: 0; }
}

@media (max-width: 600px) {
  .leaders-grid { grid-template-columns: 1fr; }
  header h1 { font-size: 16px; }
  header .subtitle { display: none; }
  table { font-size: 12px; }
  th, td { padding: 7px 8px; }
  .page-title { font-size: 22px; }
  .boxscore-header .matchup-row { font-size: 15px; }
  .boxscore-header .matchup-score { font-size: 20px; }
}

  </style>
</head>

  <script>
let DATA = null;

const NAV_ITEMS = [
  { hash: '#/', label: 'Standings' },
  { hash: '#/schedule', label: 'Schedule' },
  { hash: '#/players', label: 'Players' },
];

function calcAVG(h, ab) { return ab === 0 ? '.000' : (h / ab).toFixed(3).replace(/^0/, ''); }

function calcSLG(s) {
  if (s.AB === 0) return '.000';
  const singles = s.H - s.D - s.T - s.HR;
  const tb = singles + 2 * s.D + 3 * s.T + 4 * s.HR;
  return (tb / s.AB).toFixed(3).replace(/^0/, '');
}

function calcOBP(s) {
  const denom = s.PA;
  if (denom === 0) return '.000';
  return ((s.H + s.BB) / denom).toFixed(3).replace(/^0/, '');
}

function calcOPS(s) {
  const obp = s.PA === 0 ? 0 : (s.H + s.BB) / s.PA;
  const singles = s.H - s.D - s.T - s.HR;
  const tb = singles + 2 * s.D + 3 * s.T + 4 * s.HR;
  const slg = s.AB === 0 ? 0 : tb / s.AB;
  return (obp + slg).toFixed(3).replace(/^0/, '');
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m, 10) - 1] + ' ' + parseInt(day, 10);
}

function displayName(name) {
  if (name.includes(', ')) { const [last, first] = name.split(', '); return first + ' ' + last; }
  return name;
}

function getTeam(id) { return DATA.teams.find(t => t.id === id); }
function getPlayer(id) { return DATA.players.find(p => p.id === id); }
function getTeamPlayers(teamId) { return DATA.players.filter(p => p.teamId === teamId); }
function getTeamGames(teamId) { return DATA.games.filter(g => g.homeTeamId === teamId || g.awayTeamId === teamId); }

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV_ITEMS.map(n =>
    `<a href="${n.hash}" class="${location.hash === n.hash || (n.hash === '#/' && (!location.hash || location.hash === '#')) ? 'active' : ''}">${n.label}</a>`
  ).join('');
}

function renderTicker() {
  const el = document.getElementById('scores-ticker');
  const games = [...DATA.games].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  el.className = 'scores-ticker';
  el.innerHTML = games.map(g => {
    const home = getTeam(g.homeTeamId);
    const away = getTeam(g.awayTeamId);
    const hw = g.homeScore > g.awayScore;
    return `<a class="ticker-game" href="#/game/${g.id}" style="text-decoration:none;color:inherit">
      <div class="ticker-label">Wk ${g.week} &middot; Final</div>
      <div class="ticker-row ${!hw ? 'winner' : ''}"><span>${away.name}</span><span class="ticker-score">${g.awayScore}</span></div>
      <div class="ticker-row ${hw ? 'winner' : ''}"><span>${home.name}</span><span class="ticker-score">${g.homeScore}</span></div>
    </a>`;
  }).join('');
}

function sortableTable(id, data, columns, defaultSort, defaultDir) {
  let sortCol = defaultSort || columns[0].key;
  let sortDir = defaultDir || 'desc';

  function render() {
    const sorted = [...data].sort((a, b) => {
      let va = typeof columns.find(c => c.key === sortCol).val === 'function'
        ? columns.find(c => c.key === sortCol).val(a) : a[sortCol];
      let vb = typeof columns.find(c => c.key === sortCol).val === 'function'
        ? columns.find(c => c.key === sortCol).val(b) : b[sortCol];
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    const thead = columns.map(c => {
      const cls = [c.num ? 'num' : '', 'sortable', sortCol === c.key ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : ''].filter(Boolean).join(' ');
      return `<th class="${cls}" data-col="${c.key}">${c.label}</th>`;
    }).join('');

    const tbody = sorted.map(row => {
      return '<tr>' + columns.map(c => {
        const val = typeof c.render === 'function' ? c.render(row) : (typeof c.val === 'function' ? c.val(row) : row[c.key]);
        return `<td class="${c.num ? 'num' : ''}">${val}</td>`;
      }).join('') + '</tr>';
    }).join('');

    document.getElementById(id).innerHTML = `<div class="table-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;

    document.querySelectorAll(`#${id} th.sortable`).forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortCol = col; sortDir = 'desc'; }
        render();
      });
    });
  }
  render();
}

function pctDisplay(w, l, t) {
  const games = w + l + t;
  if (games === 0) return '.000';
  return ((w + t * 0.5) / games).toFixed(3).replace(/^0/, '');
}

function viewStandings() {
  const teams = DATA.teams.map(t => {
    const tp = getTeamPlayers(t.id);
    const sum = (key) => tp.reduce((s, p) => s + p.seasonStats[key], 0);
    const ab = sum('AB'), h = sum('H'), bb = sum('BB'), pa = sum('PA');
    const d = sum('D'), tr = sum('T'), hr = sum('HR');
    const singles = h - d - tr - hr;
    const tb = singles + 2*d + 3*tr + 4*hr;
    const slg = ab === 0 ? 0 : tb / ab;
    const obp = pa === 0 ? 0 : (h + bb) / pa;
    return {
      ...t,
      gp: t.wins + t.losses + t.ties,
      pct: parseFloat(pctDisplay(t.wins, t.losses, t.ties)),
      rs: DATA.games.reduce((s, g) => {
        if (g.homeTeamId === t.id) return s + g.homeScore;
        if (g.awayTeamId === t.id) return s + g.awayScore;
        return s;
      }, 0),
      ra: DATA.games.reduce((s, g) => {
        if (g.homeTeamId === t.id) return s + g.awayScore;
        if (g.awayTeamId === t.id) return s + g.homeScore;
        return s;
      }, 0),
      tAB: ab, tH: h, tR: sum('R'), tHR: hr, tBB: bb, tBI: sum('BI'), tE: sum('E'),
      tD: d, tT: tr,
      tAVG: ab === 0 ? 0 : h / ab,
      tSLG: slg,
      tOPS: obp + slg,
    };
  }).sort((a, b) => b.pct - a.pct || b.wins - a.wins || a.losses - b.losses);

  const fmtR = (v) => v.toFixed(3).replace(/^0/, '');

  const standingsRows = teams.map((t, i) => `<tr>
    <td class="num">${i + 1}</td>
    <td><a class="team-link" href="#/team/${t.id}">${t.name}</a></td>
    <td class="num">${t.wins}</td>
    <td class="num">${t.losses}</td>
    <td class="num">${t.ties}</td>
    <td class="num">${pctDisplay(t.wins, t.losses, t.ties)}</td>
    <td class="num">${t.rs}</td>
    <td class="num">${t.ra}</td>
    <td class="num">${t.tAB}</td>
    <td class="num">${t.tH}</td>
    <td class="num">${t.tR}</td>
    <td class="num">${t.tD}</td>
    <td class="num">${t.tT}</td>
    <td class="num">${t.tHR}</td>
    <td class="num">${t.tBB}</td>
    <td class="num">${t.tBI}</td>
    <td class="num">${t.tE}</td>
    <td class="num">${fmtR(t.tAVG)}</td>
    <td class="num">${fmtR(t.tSLG)}</td>
    <td class="num">${fmtR(t.tOPS)}</td>
  </tr>`).join('');

  // League leaders
  const qualified = DATA.players.filter(p => p.seasonStats.PA >= 3);
  const leaders = {
    'Batting Avg': qualified.map(p => ({ p, v: parseFloat(calcAVG(p.seasonStats.H, p.seasonStats.AB)) })).sort((a, b) => b.v - a.v).slice(0, 5),
    'Hits': DATA.players.map(p => ({ p, v: p.seasonStats.H })).sort((a, b) => b.v - a.v).slice(0, 5),
    'Runs': DATA.players.map(p => ({ p, v: p.seasonStats.R })).sort((a, b) => b.v - a.v).slice(0, 5),
    'RBI': DATA.players.map(p => ({ p, v: p.seasonStats.BI })).sort((a, b) => b.v - a.v).slice(0, 5),
    'OPS': qualified.map(p => ({ p, v: parseFloat(calcOPS(p.seasonStats)) })).sort((a, b) => b.v - a.v).slice(0, 5),
    'Doubles': DATA.players.map(p => ({ p, v: p.seasonStats.D })).sort((a, b) => b.v - a.v).slice(0, 5),
    'Triples': DATA.players.map(p => ({ p, v: p.seasonStats.T })).sort((a, b) => b.v - a.v).slice(0, 5),
  };

  const leadersHtml = Object.entries(leaders).map(([cat, items]) => `
    <div class="leader-cat">
      <h4>${cat}</h4>
      ${items.map(i => `<div class="leader-item">
        <a class="player-link" href="#/player/${i.p.id}">${displayName(i.p.name)}</a>
        <span class="val">${cat === 'Batting Avg' ? calcAVG(i.p.seasonStats.H, i.p.seasonStats.AB) : cat === 'OPS' ? calcOPS(i.p.seasonStats) : i.v}</span>
      </div>`).join('')}
    </div>
  `).join('');

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="card-header">Standings</div>
      <div class="card-body"><div class="table-wrap">
        <table>
          <thead><tr>
            <th class="num">#</th><th>Team</th><th class="num">W</th><th class="num">L</th><th class="num">T</th><th class="num">PCT</th><th class="num">RS</th><th class="num">RA</th><th class="num">AB</th><th class="num">H</th><th class="num">R</th><th class="num">2B</th><th class="num">3B</th><th class="num">HR</th><th class="num">BB</th><th class="num">RBI</th><th class="num">E</th><th class="num">AVG</th><th class="num">SLG</th><th class="num">OPS</th>
          </tr></thead>
          <tbody>${standingsRows}</tbody>
        </table>
      </div></div>
    </div>
    <div class="card">
      <div class="card-header">League Leaders</div>
      <div class="card-body">
        <div class="leaders-grid">${leadersHtml}</div>
      </div>
    </div>
  `;
}

function viewTeam(teamId) {
  const team = getTeam(teamId);
  if (!team) { document.getElementById('app').innerHTML = '<p>Team not found.</p>'; return; }
  const players = getTeamPlayers(teamId);
  const games = getTeamGames(teamId).sort((a, b) => a.date.localeCompare(b.date));

  const scheduleRows = games.map(g => {
    const isHome = g.homeTeamId === teamId;
    const opp = getTeam(isHome ? g.awayTeamId : g.homeTeamId);
    const teamScore = isHome ? g.homeScore : g.awayScore;
    const oppScore = isHome ? g.awayScore : g.homeScore;
    const result = teamScore > oppScore ? 'W' : teamScore < oppScore ? 'L' : 'T';
    return `<tr>
      <td>Wk ${g.week}</td>
      <td>${fmtDate(g.date)}</td>
      <td>${isHome ? 'vs' : '@'} <a class="team-link" href="#/team/${opp.id}">${opp.name}</a></td>
      <td class="num"><strong>${result}</strong> ${teamScore}-${oppScore}</td>
      <td><a class="box-link" href="#/game/${g.id}">Box Score</a></td>
    </tr>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <a class="back-link" href="#/">&larr; Standings</a>
    <div class="team-hero">
      <div class="page-title">${team.name}</div>
      <div class="record-big">${team.wins}-${team.losses}-${team.ties}</div>
      <div class="page-subtitle">${pctDisplay(team.wins, team.losses, team.ties)} PCT</div>
    </div>
    <div class="card">
      <div class="card-header">Schedule & Results</div>
      <div class="card-body"><div class="table-wrap">
        <table><thead><tr><th>Week</th><th>Date</th><th>Opponent</th><th class="num">Result</th><th></th></tr></thead>
        <tbody>${scheduleRows}</tbody></table>
      </div></div>
    </div>
    <div class="card">
      <div class="card-header">Roster & Season Stats</div>
      <div class="card-body" id="team-stats"></div>
    </div>
  `;

  const rows = players.map(p => {
    const s = p.seasonStats;
    return {
      id: p.id, name: p.name,
      G: s.G, PA: s.PA, AB: s.AB, H: s.H, R: s.R, D: s.D, T: s.T, HR: s.HR, BB: s.BB, SF: s.SF, BI: s.BI, E: s.E,
      AVG: parseFloat(calcAVG(s.H, s.AB)),
      SLG: parseFloat(calcSLG(s)),
      OPS: parseFloat(calcOPS(s)),
    };
  });

  const cols = [
    { key: 'name', label: 'Player', render: r => `<a class="player-link" href="#/player/${r.id}">${displayName(r.name)}</a>`, val: r => r.name },

    { key: 'R', label: 'R', num: true, val: r => r.R },
    { key: 'D', label: '2B', num: true, val: r => r.D },
    { key: 'T', label: '3B', num: true, val: r => r.T },
    { key: 'HR', label: 'HR', num: true, val: r => r.HR },

  ];

  sortableTable('team-stats', rows, cols, 'AVG', 'desc');
}

function ordinal(n) {
  if (typeof n === 'string') return n;
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function playerRankings(player) {
  const all = DATA.players;
  function rank(sortFn) {
    const sorted = [...all].sort(sortFn);
    const idx = sorted.findIndex(p => p.id === player.id);
    return ordinal(idx + 1);
  }
  const cats = [
    rank((a, b) => b.seasonStats.H - a.seasonStats.H),
    rank((a, b) => {
      const aa = a.seasonStats.AB === 0 ? 0 : a.seasonStats.H / a.seasonStats.AB;
      const bb = b.seasonStats.AB === 0 ? 0 : b.seasonStats.H / b.seasonStats.AB;
      return bb - aa;
    }),
    rank((a, b) => b.seasonStats.R - a.seasonStats.R),
    rank((a, b) => b.seasonStats.D - a.seasonStats.D),
    rank((a, b) => b.seasonStats.T - a.seasonStats.T),
    rank((a, b) => b.seasonStats.HR - a.seasonStats.HR),
    rank((a, b) => b.seasonStats.BB - a.seasonStats.BB),
    rank((a, b) => b.seasonStats.SF - a.seasonStats.SF),
  ];
  return cats.map(r => `<td class="num">${r}</td>`).join('');
}

          <td class="num">${s.D}</td><td class="num">${s.T}</td><td class="num">${s.HR}</td><td class="num">${s.BB}</td><td class="num">${s.SF}</td>

function viewBoxScore(gameId) {
  const game = DATA.games.find(g => g.id === gameId);
  if (!game) { document.getElementById('app').innerHTML = '<p>Game not found.</p>'; return; }
  const home = getTeam(game.homeTeamId);
  const away = getTeam(game.awayTeamId);

  function teamTable(stats, teamName) {
    const totals = stats.reduce((acc, ps) => {
      ['PA','AB','H','R','E','D','T','HR','BB','SF','BI'].forEach(k => acc[k] = (acc[k]||0) + ps[k]);
      return acc;
    }, {});

    const rows = stats.map(ps => {
      const p = getPlayer(ps.playerId);
      return `<tr>
        <td><a class="player-link" href="#/player/${ps.playerId}">${p ? displayName(p.name) : ps.playerId}</a></td>
        <td class="num">${ps.PA}</td><td class="num">${ps.AB}</td><td class="num">${ps.H}</td><td class="num">${ps.R}</td>
        <td class="num">${ps.D}</td><td class="num">${ps.T}</td><td class="num">${ps.HR}</td>
        <td class="num">${ps.BB}</td><td class="num">${ps.SF}</td><td class="num">${ps.BI}</td><td class="num">${ps.E}</td>
        <td class="num">${calcAVG(ps.H, ps.AB)}</td>
      </tr>`;
    }).join('');

    return `<div class="card">
      <div class="card-header">${teamName}</div>
      <div class="card-body"><div class="table-wrap">
        <table><thead><tr>
          <th>Player</th><th class="num">PA</th><th class="num">AB</th><th class="num">H</th><th class="num">R</th>
          <th class="num">2B</th><th class="num">3B</th><th class="num">HR</th><th class="num">BB</th><th class="num">SF</th>
          <th class="num">RBI</th><th class="num">E</th><th class="num">AVG</th>
        </tr></thead>
        <tbody>${rows}
          <tr class="totals">
            <td>Totals</td>
            <td class="num">${totals.PA}</td><td class="num">${totals.AB}</td><td class="num">${totals.H}</td><td class="num">${totals.R}</td>
            <td class="num">${totals.D}</td><td class="num">${totals.T}</td><td class="num">${totals.HR}</td>
            <td class="num">${totals.BB}</td><td class="num">${totals.SF}</td><td class="num">${totals.BI}</td><td class="num">${totals.E}</td>
            <td class="num">${calcAVG(totals.H, totals.AB)}</td>
          </tr>
        </tbody></table>
      </div></div>
    </div>`;
  }

  const hw = game.homeScore > game.awayScore;

  document.getElementById('app').innerHTML = `
    <a class="back-link" href="#/schedule">&larr; Schedule</a>
    <div class="boxscore-header">
      <div class="matchup">
        <div class="game-meta">Week ${game.week} &middot; ${fmtDate(game.date)} &middot; ${game.location}</div>
        <div class="matchup-row ${!hw ? 'winner' : ''}"><a class="team-link" href="#/team/${away.id}">${away.name}</a><span class="matchup-score">${game.awayScore}</span></div>
        <div class="matchup-row ${hw ? 'winner' : ''}"><a class="team-link" href="#/team/${home.id}">${home.name}</a><span class="matchup-score">${game.homeScore}</span></div>
        <div class="game-meta" style="margin-top:4px">Final</div>
      </div>
    </div>
    ${teamTable(game.awayStats, away.name + ' (Away)')}
    ${teamTable(game.homeStats, home.name + ' (Home)')}
  `;
}

function viewSchedule() {
  const weeks = {};
  DATA.games.forEach(g => {
    if (!weeks[g.week]) weeks[g.week] = { games: [], date: g.date };
    weeks[g.week].games.push(g);
  });

  // Determine byes
  const byes = {};
  Object.entries(weeks).forEach(([wk, w]) => {
    const teamsPlaying = new Set();
    w.games.forEach(g => { teamsPlaying.add(g.homeTeamId); teamsPlaying.add(g.awayTeamId); });
    DATA.teams.forEach(t => {
      if (!teamsPlaying.has(t.id)) {
        if (!byes[wk]) byes[wk] = [];
        byes[wk].push(t);
      }
    });
  });

  const html = Object.entries(weeks).sort((a, b) => a[0] - b[0]).map(([wk, w]) => {
    const gamesHtml = w.games.map(g => {
      const home = getTeam(g.homeTeamId);
      const away = getTeam(g.awayTeamId);
      const hw = g.homeScore > g.awayScore;
      return `<div class="score-box">
        <div class="teams">
          <div class="team-row ${!hw ? 'winner' : ''}"><a class="team-link" href="#/team/${away.id}">${away.name}</a><span class="score">${g.awayScore}</span></div>
          <div class="team-row ${hw ? 'winner' : ''}"><a class="team-link" href="#/team/${home.id}">${home.name}</a><span class="score">${g.homeScore}</span></div>
        </div>
        <a class="box-link" href="#/game/${g.id}">Box Score</a>
      </div>`;
    }).join('');

    const byeHtml = byes[wk] ? `<div class="bye-label">BYE: ${byes[wk].map(t => t.name).join(', ')}</div>` : '';

    return `<div class="card">
      <div class="card-header">Week ${wk} &mdash; ${fmtDate(w.date)}</div>
      <div class="card-body">${gamesHtml}${byeHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="page-title">Schedule</div>
    <div class="page-subtitle">All games by week</div>
    ${html}
  `;
}

function router() {
  const hash = location.hash || '#/';
  renderNav();
  renderTicker();

  if (hash.startsWith('#/team/')) {
    viewTeam(hash.replace('#/team/', ''));
  } else if (hash.startsWith('#/player/')) {
    viewPlayer(hash.replace('#/player/', ''));
  } else if (hash.startsWith('#/game/')) {
    viewBoxScore(hash.replace('#/game/', ''));
  } else if (hash === '#/players') {
    viewAllPlayers();
  } else if (hash === '#/schedule') {
    viewSchedule();
  } else {
    viewStandings();
  }
}

function init() {
  DATA = window.INLINE_DATA;
  window.addEventListener('hashchange', router);
  router();
}

init();
