<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burlingame Dad's Softball — Moved</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9918;</text></svg>">
<!-- No-JS fallback: browsers that ignore the script still redirect after 5s. -->
<meta http-equiv="refresh" content="5;url=https://softball.onionbelt.net">
<style>
  :root { --navy:#041E42; --navy2:#0a2c5c; --cream:#f5f0e4; --stitch:#e23a52; --muted:#9fb4d4; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1000px 500px at 50% -10%, #12335f, transparent 60%), linear-gradient(160deg,var(--navy),var(--navy2));
    color:var(--cream); display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .card { max-width:520px; }
  .ball { font-size:64px; line-height:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)); animation:spin 5s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:24px; font-weight:700; margin:22px 0 10px; letter-spacing:.01em; }
  p { font-size:16px; line-height:1.6; color:#dfe7f4; margin:0 0 8px; }
  a.dest { color:#fff; font-weight:600; text-decoration:none; border-bottom:2px solid var(--stitch); white-space:nowrap; }
  a.dest:hover { color:var(--stitch); }
  .count { margin-top:22px; font-size:15px; color:var(--muted); }
  .count b { display:inline-flex; min-width:1.6em; height:1.6em; align-items:center; justify-content:center; margin:0 4px;
    background:var(--stitch); color:#fff; border-radius:50%; font-size:15px; }
  .go { display:inline-block; margin-top:22px; padding:11px 22px; background:var(--cream); color:var(--navy);
    text-decoration:none; border-radius:999px; font-weight:600; font-size:15px; transition:.15s; }
  .go:hover { background:#fff; transform:translateY(-1px); }
  @media (prefers-reduced-motion: reduce) { .ball { animation:none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="ball">⚾</div>
    <h1>This page has moved</h1>
    <p>Burlingame Dad's Softball now lives at<br><a class="dest" href="https://softball.onionbelt.net">softball.onionbelt.net</a></p>
    <div class="count">Redirecting you in <b id="n">5</b> seconds…</div>
    <a class="go" href="https://softball.onionbelt.net">Go there now →</a>
  </div>
<script>
  (function () {
    var url = 'https://softball.onionbelt.net';
    var n = 5, el = document.getElementById('n');
    var t = setInterval(function () {
      n -= 1;
      if (el) el.textContent = Math.max(0, n);
      if (n <= 0) { clearInterval(t); window.location.replace(url); }
    }, 1000);
  })();
</script>
</body>
</html>
