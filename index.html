    'week2-game4': `<p><strong>Lincoln Lions 8, Roosevelt Blue 6</strong> &mdash; This one didn&rsquo;t come easy. Lincoln made it 2-0 on the season with an 8-6 win over a Roosevelt Blue squad that pushed them to the final out, grinding out a victory that looked more like a fight than a formality.</p>

<p>Mike Benveniste did the heavy lifting again &mdash; 2-for-3, 2 runs, an RBI, back-to-back multi-hit performances to open the season. Francisco Martinez drove in 2 with a double and scored twice out of the sixth spot. Alan Ching and Peter Ou combined to go 4-for-4, the kind of production from the bottom of the order that gives Lincoln the depth to outrun deficits. Seven different Lions drove in at least one run. In a lineup this complete, there&rsquo;s no single player you can pitch around.</p>

<p>Roosevelt refused to go quietly. Ankush Bhargava drove in 3 runs on a single hit &mdash; a clutch, high-leverage performance that briefly made this a different game. David Vinca and Nick Adler each went 2-for-3 and scored. Joe Carvillo crossed the plate twice. Roosevelt had the opportunities, stranded too many runners, and couldn&rsquo;t string together the hits needed to erase the deficit when it mattered most.</p>

<p>Lincoln looks like the real deal. Roosevelt Blue needs a win in the worst way.</p>`,
  };;

  const recapHtml = GAME_RECAPS[gameId] ? `<div class="card">
    <div class="card-header">Game Recap</div>
    <div class="card-body padded" style="line-height:1.7">${GAME_RECAPS[gameId]}</div>
  </div>` : '';

  // Compute records before this game's week
  const cumRec = {};
  DATA.teams.forEach(t => { cumRec[t.id] = { w: 0, l: 0, t: 0 }; });
  DATA.games.forEach(g => {
    if (g.week < game.week) {
      if (!cumRec[g.homeTeamId]) cumRec[g.homeTeamId] = { w: 0, l: 0, t: 0 };
      if (!cumRec[g.awayTeamId]) cumRec[g.awayTeamId] = { w: 0, l: 0, t: 0 };
      if (g.homeScore > g.awayScore) { cumRec[g.homeTeamId].w++; cumRec[g.awayTeamId].l++; }
      else if (g.awayScore > g.homeScore) { cumRec[g.awayTeamId].w++; cumRec[g.homeTeamId].l++; }
      else { cumRec[g.homeTeamId].t++; cumRec[g.awayTeamId].t++; }
    }
  });
  const fmtRec = r => r.t > 0 ? `(${r.w}-${r.l}-${r.t})` : `(${r.w}-${r.l})`;
  const awayRec = away ? fmtRec(cumRec[away.id]) : '';
  const homeRec = home ? fmtRec(cumRec[home.id]) : '';

  document.getElementById('app').innerHTML = `
    <div style="display:flex;align-items:center"><a class="back-link" href="#/schedule">&larr; Schedule</a>${shareBtn()}</div>
    <div class="boxscore-header">
      <div class="matchup">
        <div class="game-meta">Week ${game.week} &middot; ${fmtDate(game.date)}${game.location ? ' &middot; ' + game.location : ''}</div>
        <div class="matchup-row ${!hw ? 'winner' : ''}"><span class="team-name-rec"><a class="team-link" href="#/team/${away ? away.id : ''}">${away ? teamLogoImg(away.id) + away.name : 'Unknown'}</a> <span class="record-inline">${awayRec}</span></span><span class="matchup-score">${game.awayScore}</span></div>
        <div class="matchup-row ${hw ? 'winner' : ''}"><span class="team-name-rec"><a class="team-link" href="#/team/${home ? home.id : ''}">${home ? teamLogoImg(home.id) + home.name : 'Unknown'}</a> <span class="record-inline">${homeRec}</span></span><span class="matchup-score">${game.homeScore}</span></div>
        <div class="game-meta" style="margin-top:4px">Final</div>
      </div>
    </div>
    ${recapHtml}
    ${teamTable(game.awayStats, (away ? away.name : 'Away') + ' (Away)')}
    ${teamTable(game.homeStats, (home ? home.name : 'Home') + ' (Home)')}
  `;
}

function viewAllPlayers() {
  const rows = DATA.players.map(p => {
    const s = p.seasonStats;
    const team = getTeam(p.teamId);
    return {
      id: p.id, name: p.name, teamId: p.teamId, teamName: team ? team.name : '',
      G: s.G, PA: s.PA, AB: s.AB, H: s.H, R: s.R, D: s.D, T: s.T, HR: s.HR, BB: s.BB, SF: s.SF, BI: s.BI, E: s.E,
      AVG: parseFloat(calcAVG(s.H, s.AB)),
      SLG: parseFloat(calcSLG(s)),
      OPS: parseFloat(calcOPS(s)),
    };
  });

  document.getElementById('app').innerHTML = `
    <div class="page-title">Player Stats</div>
    <div class="page-subtitle">Click any column header to sort &middot; click + Compare to compare two players</div>
    <div class="search-bar">
      <input id="player-search" class="search-input" type="text" placeholder="Search players..." oninput="filterAllPlayers(this.value)" autocomplete="off">
      <span class="search-count" id="player-search-count"></span>
    </div>
    <div class="card">
      <div class="card-body" id="all-players-table"></div>
    </div>
  `;

  window._allPlayersRows = rows;
  window.filterAllPlayers = function(q) {
    const filtered = q.trim() === '' ? rows : rows.filter(r =>
      displayName(r.name).toLowerCase().includes(q.toLowerCase()) ||
      r.teamName.toLowerCase().includes(q.toLowerCase())
    );
    document.getElementById('player-search-count').textContent = q.trim() ? `${filtered.length} of ${rows.length} players` : '';
    sortableTable('all-players-table', filtered, allPlayersCols, 'AVG', 'desc');
  };

  const allPlayersCols = [
    { key: 'name', label: 'Player', render: r => `<img class="mini-avatar" src="${avatarUrl(r.name, 26)}" alt=""><a class="player-link" href="#/player/${r.id}">${displayName(r.name)}</a>`, val: r => r.name },
    { key: 'teamName', label: 'Team', render: r => `<a class="team-link" href="#/team/${r.teamId}">${teamLogoImg(r.teamId)}${r.teamName}</a>`, val: r => r.teamName },
    { key: 'G', label: 'G', num: true, val: r => r.G },
    { key: 'PA', label: 'PA', num: true, val: r => r.PA },
    { key: 'AB', label: 'AB', num: true, val: r => r.AB },
    { key: 'H', label: 'H', num: true, val: r => r.H },
    { key: 'R', label: 'R', num: true, val: r => r.R },
    { key: 'D', label: '2B', num: true, val: r => r.D },
    { key: 'T', label: '3B', num: true, val: r => r.T },
    { key: 'HR', label: 'HR', num: true, val: r => r.HR },
    { key: 'BB', label: 'BB', num: true, val: r => r.BB },
    { key: 'SF', label: 'SF', num: true, val: r => r.SF },
    { key: 'BI', label: 'RBI', num: true, val: r => r.BI },
    { key: 'E', label: 'E', num: true, val: r => r.E },
    { key: 'AVG', label: 'AVG', num: true, render: r => calcAVG(r.H, r.AB), val: r => r.AVG },
    { key: 'SLG', label: 'SLG', num: true, render: r => r.SLG.toFixed(3).replace(/^0/, ''), val: r => r.SLG },
    { key: 'OPS', label: 'OPS', num: true, render: r => r.OPS.toFixed(3).replace(/^0/, ''), val: r => r.OPS },
  ];

  sortableTable('all-players-table', rows, allPlayersCols, 'AVG', 'desc');
}

function viewSchedule(scrollToWeek) {
  const weeks = {};
  DATA.games.forEach(g => {
    if (!weeks[g.week]) weeks[g.week] = { games: [], date: g.date };
    weeks[g.week].games.push(g);
  });

  // Build cumulative records: before each game, what is each team's W-L-T?
  const sortedWeeks = Object.keys(weeks).map(Number).sort((a, b) => a - b);
  const recordBeforeGame = {}; // gameId -> teamId -> {w, l, t}
  const cumulative = {};
  DATA.teams.forEach(t => { cumulative[t.id] = { w: 0, l: 0, t: 0 }; });
  sortedWeeks.forEach(wk => {
    weeks[wk].games.forEach(g => {
      if (!cumulative[g.homeTeamId]) cumulative[g.homeTeamId] = { w: 0, l: 0, t: 0 };
      if (!cumulative[g.awayTeamId]) cumulative[g.awayTeamId] = { w: 0, l: 0, t: 0 };
      recordBeforeGame[g.id] = {
        [g.homeTeamId]: { ...cumulative[g.homeTeamId] },
        [g.awayTeamId]: { ...cumulative[g.awayTeamId] },
      };
      if (g.homeScore !== undefined && g.awayScore !== undefined) {
        if (g.homeScore > g.awayScore) {
          cumulative[g.homeTeamId].w++;
          cumulative[g.awayTeamId].l++;
        } else if (g.awayScore > g.homeScore) {
          cumulative[g.awayTeamId].w++;
          cumulative[g.homeTeamId].l++;
        } else {
          cumulative[g.homeTeamId].t++;
          cumulative[g.awayTeamId].t++;
        }
      }
    });
  });

  function fmtRecord(r) {
    return r.t > 0 ? `(${r.w}-${r.l}-${r.t})` : `(${r.w}-${r.l})`;
  }

  // Determine byes
  const byes = {};
  Object.entries(weeks).forEach(([wk, w]) => {
    const teamsPlaying = new Set();
    w.games.forEach(g => { teamsPlaying.add(g.homeTeamId); teamsPlaying.add(g.awayTeamId); });
    DATA.teams.forEach(t => {
      if (!teamsPlaying.has(t.id)) {
        if (!byes[wk]) byes[wk] = [];
        byes[wk].push(t);
      }
    });
  });

  const html = Object.entries(weeks).sort((a, b) => a[0] - b[0]).map(([wk, w]) => {
    // Compute game-of-the-week badges for this week
    const playedGames = w.games.filter(g => g.homeScore !== undefined);
    let barnburnerId = null, nailbiterId = null;
    if (playedGames.length > 0) {
      const byTotal = [...playedGames].sort((a, b) => (b.homeScore+b.awayScore) - (a.homeScore+a.awayScore));
      const byDiff  = [...playedGames].sort((a, b) => Math.abs(a.homeScore-a.awayScore) - Math.abs(b.homeScore-b.awayScore));
      barnburnerId = byTotal[0].id;
      nailbiterId  = byDiff[0].id;
      // If same game, just use nailbiter label
      if (barnburnerId === nailbiterId) barnburnerId = null;
    }

    const gamesHtml = w.games.map(g => {
      const home = getTeam(g.homeTeamId);
      const away = getTeam(g.awayTeamId);
      if (!home || !away) return '';
      const played = g.homeScore !== undefined;
      const hw = played && g.homeScore > g.awayScore;
      const hasBox = played && (g.homeStats || g.awayStats);
      const awayRec = recordBeforeGame[g.id] && recordBeforeGame[g.id][away.id] ? fmtRecord(recordBeforeGame[g.id][away.id]) : '';
      const homeRec = recordBeforeGame[g.id] && recordBeforeGame[g.id][home.id] ? fmtRecord(recordBeforeGame[g.id][home.id]) : '';
      const clickable = (hasBox || !played) ? `onclick="if(event.target.closest('a')===null)location.hash='#/game/${g.id}'" style="cursor:pointer"` : '';
      const badge = g.id === nailbiterId ? `<span class="game-badge nailbiter" title="Closest game of the week">&#9889; Nail-biter</span>`
                  : g.id === barnburnerId ? `<span class="game-badge barnburner" title="Highest-scoring game of the week">&#128293; Barnburner</span>` : '';
      return `<div class="score-box${played ? '' : ' unplayed'}" ${clickable}>
        <div class="teams">
          <div class="team-row ${played && !hw ? 'winner' : ''}"><span class="team-name-rec"><a class="team-link" href="#/team/${away.id}">${teamLogoImg(away.id)}${away.name}</a> <span class="record-inline">${awayRec}</span></span>${played ? `<span class="score">${g.awayScore}</span>` : ''}</div>
          <div class="team-row ${played && hw ? 'winner' : ''}"><span class="team-name-rec"><a class="team-link" href="#/team/${home.id}">${teamLogoImg(home.id)}${home.name}</a> <span class="record-inline">${homeRec}</span></span>${played ? `<span class="score">${g.homeScore}</span>` : ''}</div>
        </div>
        ${badge}
      </div>`;
    }).join('');

    const byeHtml = byes[wk] ? `<div class="bye-label">BYE: ${byes[wk].map(t => t.name).join(', ')}</div>` : '';

    return `<div class="card" id="week-${wk}">
      <div class="card-header">Week ${wk} &mdash; ${fmtDate(w.date)}</div>
      <div class="card-body">${gamesHtml}${byeHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="page-title">Schedule</div>
    <div class="page-subtitle">All games by week</div>
    ${html}
  `;
  if (scrollToWeek) {
    setTimeout(() => {
      const el = document.getElementById('week-' + scrollToWeek);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }
}

function router() {
  window.scrollTo(0, 0);
  const hash = location.hash || '#/';
  renderNav();
  renderTicker();

  if (hash.startsWith('#/team/')) {
    viewTeam(hash.replace('#/team/', ''));
  } else if (hash.startsWith('#/player/')) {
    viewPlayer(hash.replace('#/player/', ''));
  } else if (hash.startsWith('#/game/')) {
    viewBoxScore(hash.replace('#/game/', ''));
  } else if (hash === '#/players') {
    viewAllPlayers();
  } else if (hash.startsWith('#/compare')) {
    const parts = hash.replace('#/compare', '').replace(/^\//, '').split('/');
    viewCompare(parts[0] || null, parts[1] || null);
  } else if (hash.startsWith('#/schedule')) {
    const weekMatch = hash.match(/#\/schedule\/week\/(\d+)/);
    viewSchedule(weekMatch ? parseInt(weekMatch[1]) : null);
  } else {
    viewStandings();
  }
}

function init() {
  const urlSeason = new URLSearchParams(location.search).get('season');
  if (urlSeason && SEASONS[urlSeason]) {
    currentSeason = urlSeason;
  }
  DATA = SEASONS[currentSeason];
  document.getElementById('season-picker').value = currentSeason;
  const subtitleEl = document.getElementById('season-subtitle'); if (subtitleEl) subtitleEl.textContent = 'Burlingame · ' + SEASON_LABELS[currentSeason];
  window.addEventListener('hashchange', router);
  router();
}

init();
