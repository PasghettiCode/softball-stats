<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burlingame Dad's Softball</title>
  <style>

















* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --mlb-blue: #002D72;
  --mlb-red: #E4002B;
  --mlb-dark: #041E42;
  --mlb-nav: #002147;
  --link-blue: #0056b3;
  --bg: #f4f4f4;
  --white: #fff;
  --border: #ddd;
  --border-light: #eee;
  --text: #1a1a1a;
  --text-secondary: #555;
  --text-muted: #888;
  --row-alt: #f9fbfd;
  --row-hover: #edf2f7;
}

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--mlb-dark);
  color: var(--white);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 200;
}

header h1 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.3px;
  text-transform: none;
}

/* ── Nav ── */
nav {
  background: var(--mlb-blue);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  position: sticky;
  top: 56px;
  z-index: 199;
  border-bottom: 3px solid var(--mlb-red);
}

nav a {
  color: rgba(255,255,255,.75);
  text-decoration: none;
  padding: 11px 20px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  text-transform: none;
  letter-spacing: .5px;
  border-bottom: 3px solid transparent;
  margin-bottom: -3px;
  transition: color .15s, border-color .15s;
}

nav a:hover { color: var(--white); }
nav a.active {
  color: var(--white);
  border-bottom-color: var(--white);
}

/* ── Scores ticker ── */
.scores-ticker {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  display: flex;
  gap: 0;
  padding: 0;
}

.ticker-game {
  min-width: 180px;
  padding: 10px 16px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
  cursor: pointer;
  transition: background .15s;
}

.ticker-game:hover { background: var(--row-hover); }
.ticker-game:last-child { border-right: none; }

.ticker-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-secondary);
}

.ticker-row.winner { color: var(--text); font-weight: 700; }
.ticker-row .team-inline-logo { width: 16px; height: 16px; }
.ticker-score { font-weight: 700; font-size: 14px; min-width: 20px; text-align: right; }
.ticker-label { font-size: 10px; color: var(--text-muted); letter-spacing: .5px; text-align: center; padding-top: 2px; }

/* ── Main container ── */
#app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* ── Cards ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 24px;
  overflow: hidden;
}

.card-header {
  background: var(--white);
  color: var(--mlb-blue);
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 800;
  text-transform: none;
  letter-spacing: .3px;
  border-bottom: 2px solid var(--mlb-blue);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-body { padding: 0; }
.card-body.padded { padding: 20px; }
.card-body.padded p { margin: 0 0 14px 0; }
.card-body.padded p:last-child { margin-bottom: 0; }
.card-body.padded p strong { color: var(--mlb-dark); }

/* ── Tables ── */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: var(--mlb-blue);
  color: var(--white);
  font-weight: 600;
  font-size: 11px;
  text-align: left;
  text-transform: none;
  letter-spacing: .5px;
  padding: 10px 12px;
  white-space: nowrap;
  cursor: default;
  user-select: none;
  border-bottom: none;
}

th.sortable { cursor: pointer; }
th.sortable:hover { background: #003a8c; }
th.sort-asc::after { content: ' \25B2'; font-size: 9px; }
th.sort-desc::after { content: ' \25BC'; font-size: 9px; }

th.num, td.num { text-align: right; }

td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
}

tbody tr:nth-child(even) td { background: var(--row-alt); }
tbody tr:hover td { background: var(--row-hover); }

tr.totals td {
  font-weight: 700;
  border-top: 2px solid var(--mlb-blue);
  background: #edf2f7;
}

/* ── Links ── */
a.player-link, a.team-link, a.game-link {
  color: var(--link-blue);
  text-decoration: none;
  font-weight: 600;
}

a.player-link:hover, a.team-link:hover, a.game-link:hover {
  color: var(--mlb-red);
  text-decoration: underline;
}

/* ── Score boxes (schedule & box score pages) ── */
.score-box {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-light);
  transition: background .1s;
}

.score-box:hover { background: var(--row-hover); }
.score-box.unplayed:hover { background: var(--row-hover); cursor: pointer; }
.score-box:last-child { border-bottom: none; }
.score-box .teams { flex: 1; }

.score-box .team-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 14px;
  color: var(--text-secondary);
}

.score-box .team-row.winner { font-weight: 700; color: var(--text); }
.score-box .score { font-weight: 800; min-width: 28px; text-align: right; font-size: 16px; }
.record-inline { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
.score-box .week-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: .5px;
  font-weight: 700;
  margin-right: 12px;
  min-width: 50px;
}

.box-link {
  font-size: 12px;
  color: var(--white);
  background: var(--mlb-blue);
  text-decoration: none;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 4px;
  text-transform: none;
  letter-spacing: .5px;
  transition: background .15s;
}

.box-link:hover { background: var(--mlb-red); text-decoration: none; }

/* ── Leaders ── */
.leaders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0;
  padding: 0;
}

.leader-cat {
  padding: 16px 20px;
  border-right: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
}

.leader-cat h4 {
  font-size: 11px;
  text-transform: none;
  letter-spacing: .8px;
  color: var(--mlb-blue);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--mlb-red);
  font-weight: 800;
}

.leader-cat .leader-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
}

.leader-cat .leader-item .val {
  font-weight: 800;
  color: var(--mlb-blue);
  font-size: 14px;
  white-space: nowrap;
  margin-left: 8px;
}
.leader-cat .leader-item .leader-name { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
.leader-cat .leader-item .leader-name a { flex-shrink: 0; }
.leader-team-name { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
.leader-team-name .team-inline-logo { width: 14px; height: 14px; flex-shrink: 0; margin-right: 0; }
.leader-team-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Bye label ── */
.bye-label {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-light);
  background: var(--row-alt);
}

/* ── Back link ── */
.back-link {
  display: inline-flex;
  align-items: center;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--link-blue);
  text-decoration: none;
  text-transform: none;
  letter-spacing: .3px;
}

.back-link:hover { color: var(--mlb-red); }

/* ── Page titles ── */
.page-title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--mlb-dark);
}

.page-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

/* ── Team page hero ── */
.team-hero {
  background: linear-gradient(135deg, var(--mlb-dark), var(--mlb-blue));
  color: var(--white);
  padding: 32px 28px;
  border-radius: 8px;
  margin-bottom: 24px;
}

.team-hero-content { display: flex; align-items: center; gap: 20px; }
.team-inline-logo { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; margin-right: 4px; flex-shrink: 0; }
.team-name-with-logo { display: inline-flex; align-items: center; }
.team-hero-logo { width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); flex-shrink: 0; }
.team-hero .page-title { color: var(--white); font-size: 32px; }
.team-hero .page-subtitle { color: rgba(255,255,255,.7); margin-bottom: 0; }

.team-hero .record-big {
  font-size: 22px;
  font-weight: 800;
  margin-top: 4px;
  color: rgba(255,255,255,.9);
}

/* ── Player page hero ── */
.player-hero {
  background: linear-gradient(135deg, var(--mlb-dark), var(--mlb-blue));
  color: var(--white);
  padding: 28px;
  border-radius: 8px;
  margin-bottom: 24px;
}

.player-hero .page-title { color: var(--white); font-size: 28px; }
.player-hero .page-subtitle { color: rgba(255,255,255,.7); margin-bottom: 0; }
.player-hero .page-subtitle a { color: rgba(255,255,255,.85); }
.player-hero .page-subtitle a:hover { color: var(--white); }

/* ── Box score header ── */
.boxscore-header {
  background: var(--mlb-dark);
  color: var(--white);
  border-radius: 8px;
  padding: 20px 28px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 32px;
}

.boxscore-header .matchup { flex: 1; }

.boxscore-header .matchup-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 18px;
}

.boxscore-header .matchup-row a { color: rgba(255,255,255,.75); font-size: 18px; }
.boxscore-header .matchup-row.winner a { color: var(--white); }
.boxscore-header .matchup-score { font-weight: 800; font-size: 24px; color: var(--white); }
.boxscore-header .matchup-row.winner .matchup-score { color: var(--white); }

.boxscore-header .game-meta {
  font-size: 11px;
  color: rgba(255,255,255,.5);
  text-transform: none;
  letter-spacing: .5px;
}

/* ── Layout ── */
.two-col {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: 24px;
}

@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
  .leaders-grid { grid-template-columns: 1fr 1fr; }
  nav a { padding: 10px 14px; font-size: 11px; }
  #app { padding: 16px; }
  header { padding: 0 16px; }
  .team-hero, .player-hero, .boxscore-header { padding: 20px; border-radius: 0; }
}

@media (max-width: 600px) {
  .leaders-grid { grid-template-columns: 1fr; }
  header h1 { font-size: 16px; }
  table { font-size: 12px; }
  th, td { padding: 7px 8px; }
  .page-title { font-size: 22px; }
  .boxscore-header .matchup-row { font-size: 15px; }
  .boxscore-header .matchup-score { font-size: 20px; }
}

  
/* Season selector */
.season-select {
  background: rgba(255,255,255,.15);
  color: rgba(255,255,255,.55);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  margin-left: 14px;
  cursor: pointer;
  outline: none;
}
.season-select:hover { background: rgba(255,255,255,.25); }
.season-select option { color: #333; background: white; }

.prev-season-table { opacity: 0.85; }
.prev-season-label {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding: 4px 0;
}

/* ── Dark mode ── */


/* ── Player avatar ── */
.player-hero-inner {
  display: flex;
  align-items: center;
  gap: 20px;
}
.player-avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.3);
  flex-shrink: 0;
  background: rgba(255,255,255,.1);
}

/* ── Achievement badges ── */
.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,.85);
}
.badge.gold { background: rgba(255,210,0,.2); border-color: rgba(255,210,0,.5); color: #ffd700; }
.badge.fire { background: rgba(255,80,40,.2); border-color: rgba(255,80,40,.5); color: #ff7755; }
.badge.blue { background: rgba(60,160,255,.2); border-color: rgba(60,160,255,.5); color: #60b4ff; }

.badge[data-tip] { position: relative; cursor: help; }
.badge[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%);
  background: #1a1f2e;
  color: #e8eaf0;
  font-size: 11px;
  font-weight: 400;
  white-space: nowrap;
  padding: 5px 10px;
  border-radius: 5px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  z-index: 300;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  letter-spacing: 0;
}
.badge[data-tip]::before {
  content: '';
  position: absolute;
  bottom: calc(100% + 1px);
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #1a1f2e;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  z-index: 300;
}
.badge[data-tip]:hover::after,
.badge[data-tip]:hover::before { opacity: 1; }

/* ── Player search ── */
.search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.search-input {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  width: 220px;
  background: var(--white);
  color: var(--text);
  transition: border-color .15s;
}
.search-input:focus { outline: none; border-color: var(--mlb-blue); box-shadow: 0 0 0 2px rgba(0,45,114,.15); }
.search-count { font-size: 13px; color: var(--text-muted); }

/* ── Mini avatar in tables ── */
.mini-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 7px;
  border: 1px solid var(--border);
  background: var(--border-light);
}

/* ── Hot/cold streak ── */
.streak-hot { color: #ff5533; font-weight: 700; font-size: 12px; margin-left: 5px; }
.streak-cold { color: #5599ff; font-weight: 700; font-size: 12px; margin-left: 5px; }

/* ── Compare page ── */
.compare-pickers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.compare-picker-card {
  background: var(--white);
  border: 2px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  transition: border-color .15s;
}
.compare-picker-card.selected { border-color: var(--mlb-blue); }
.compare-picker-card:nth-child(2).selected { border-color: var(--mlb-red); }
.compare-picker-header {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .6px;
  color: white;
  background: var(--mlb-blue);
}
.compare-picker-card:nth-child(2) .compare-picker-header { background: var(--mlb-red); }
.compare-picker-inner { padding: 12px; }
.compare-filter {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  margin-bottom: 8px;
  background: var(--white);
  color: var(--text);
}
.compare-filter:focus { outline: none; border-color: var(--mlb-blue); }
.compare-select {
  width: 100%;
  height: 160px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  background: var(--white);
  color: var(--text);
  padding: 4px;
}
.compare-select option { padding: 5px 8px; }
.compare-select option:checked { background: var(--mlb-blue); color: white; }

/* ── Compare results table ── */
.compare-result { margin-top: 8px; }
.compare-result-header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 0;
  background: var(--mlb-dark);
  border-radius: 8px 8px 0 0;
  overflow: hidden;
}
.compare-result-header .p-col {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  color: white;
}
.compare-result-header .p-col:first-child { background: var(--mlb-blue); }
.compare-result-header .p-col:last-child { background: var(--mlb-red); justify-content: flex-end; flex-direction: row-reverse; }
.compare-result-header img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); flex-shrink: 0; }
.compare-result-header .p-name { font-weight: 800; font-size: 14px; line-height: 1.3; }
.compare-result-header .p-team { font-size: 11px; opacity: .7; font-weight: 400; }
.compare-result-header .vs-col { background: var(--mlb-dark); display: flex; align-items: center; justify-content: center; padding: 0 14px; font-size: 13px; font-weight: 800; color: rgba(255,255,255,.5); }
.compare-stats-table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.compare-stats-table tr:last-child td { border-bottom: none; }
.compare-stats-table td { border-bottom: 1px solid var(--border-light); padding: 9px 16px; font-size: 14px; }
.compare-stats-table .c-label { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .6px; color: var(--text-muted); background: var(--row-alt); width: 70px; }
.compare-stats-table .c-val { font-weight: 800; font-size: 16px; color: var(--text); }
.compare-stats-table .c-val.c-win { color: var(--mlb-red); }
.compare-stats-table .c-val.c-win-blue { color: var(--mlb-blue); }
.compare-stats-table td:nth-child(1) { text-align: right; }
.compare-stats-table td:nth-child(3) { text-align: left; }
.compare-stats-table tr:nth-child(even) td { background: var(--row-alt); }
.compare-stats-table tr:nth-child(even) .c-label { background: #e8eef5; }

/* ── Game preview ── */
.preview-header {
  background: linear-gradient(135deg, #041e42, #1a3a6e);
  border-radius: 8px;
  padding: 22px 28px;
  color: white;
  margin-bottom: 24px;
}
.preview-label { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,.55); margin-bottom: 8px; }
.preview-matchup { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.preview-team { font-size: 22px; font-weight: 800; }
.preview-team a { color: white; text-decoration: none; }
.preview-team a:hover { text-decoration: underline; }
.preview-vs { font-size: 13px; color: rgba(255,255,255,.4); font-weight: 700; }
.preview-meta { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 8px; }
.preview-record { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 600; }
.key-players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.key-player-col { padding: 16px 20px; border-right: 1px solid var(--border-light); }
.key-player-col:last-child { border-right: none; }
.key-player-col h4 { font-size: 12px; font-weight: 800; color: var(--mlb-blue); margin-bottom: 10px; letter-spacing: .4px; }
.key-player-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
.key-player-item:last-child { border-bottom: none; }
.key-player-item img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); flex-shrink: 0; }
.key-player-item .kp-name { flex: 1; font-weight: 600; }
.key-player-item .kp-stat { font-size: 12px; color: var(--text-muted); }
.key-player-item .kp-val { font-weight: 800; color: var(--mlb-blue); font-size: 13px; }

@media (max-width: 700px) {
  .compare-pickers { grid-template-columns: 1fr; }
  .compare-result-header { grid-template-columns: 1fr 1fr; }
  .compare-result-header .vs-col { display: none; }
  .player-avatar { width: 56px; height: 56px; }
  .player-hero-inner { gap: 14px; }
  .key-players-grid { grid-template-columns: 1fr; }
  .key-player-col { border-right: none; border-bottom: 1px solid var(--border-light); }
}


/* ── Share button ── */
.share-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .15s;
  margin-left: auto;
}
.share-btn:hover { border-color: var(--mlb-blue); color: var(--mlb-blue); }
.page-title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.page-title-row .page-title { margin-bottom: 0; }

/* ── Last updated ── */
.last-updated {
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  padding: 16px;
  border-top: 1px solid var(--border-light);
  margin-top: 8px;
}

/* ── Sparkline ── */
.sparkline-wrap { padding: 16px 20px; }
.sparkline-label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: .5px; margin-bottom: 8px; }
.sparkline-trend { font-size: 12px; font-weight: 700; margin-left: 8px; }
.sparkline-trend.up { color: #22a861; }
.sparkline-trend.down { color: var(--mlb-red); }

/* ── Career chart ── */
.career-chart { padding: 0 20px 4px; }
.cc-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.cc-row:last-child { border-bottom: none; }
.cc-season { font-size: 12px; color: var(--text-muted); width: 88px; flex-shrink: 0; font-weight: 600; }
.cc-bars { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.cc-bar-row { display: flex; align-items: center; gap: 6px; font-size: 10px; }
.cc-bar-key { width: 26px; color: var(--text-muted); font-weight: 700; letter-spacing: .3px; }
.cc-bar-track { flex: 1; background: var(--border-light); border-radius: 3px; height: 10px; overflow: hidden; }
.cc-bar-fill { height: 100%; border-radius: 3px; background: var(--mlb-blue); transition: width .4s ease; }
.cc-bar-fill.ops { background: var(--mlb-red); }
.cc-bar-val { font-size: 11px; font-weight: 800; color: var(--text); min-width: 34px; }

/* ── Awards panel ── */
.awards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.award-item { padding: 14px 16px; border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); }
.award-icon { font-size: 20px; margin-bottom: 4px; }
.award-label { font-size: 10px; font-weight: 800; letter-spacing: .7px; color: var(--text-muted); margin-bottom: 5px; }
.award-player { font-size: 14px; font-weight: 700; min-width: 0; overflow: hidden; }
.award-player a { color: var(--mlb-blue); text-decoration: none; }
.award-player a:hover { color: var(--mlb-red); }
.award-winner-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
.award-winner-row > a { flex-shrink: 0; }
.award-team-name { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; font-size: 11px; color: var(--text-muted); }
.award-team-name .team-inline-logo { width: 13px; height: 13px; flex-shrink: 0; margin-right: 0; }
.award-team-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.award-stat { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ── Game of the week badge ── */
.game-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
  align-self: center;
  flex-shrink: 0;
}
.game-badge.barnburner { background: rgba(228,0,43,.1); color: var(--mlb-red); border: 1px solid rgba(228,0,43,.25); }
.game-badge.nailbiter { background: rgba(0,45,114,.08); color: var(--mlb-blue); border: 1px solid rgba(0,45,114,.2); }
.score-box { gap: 8px; }

  </style>

function calcAVG(h, ab) { return ab === 0 ? '.000' : (h / ab).toFixed(3).replace(/^0/, ''); }

function calcSLG(s) {
  if (s.AB === 0) return '.000';
  const singles = s.H - s.D - s.T - s.HR;
  const tb = singles + 2 * s.D + 3 * s.T + 4 * s.HR;
  return (tb / s.AB).toFixed(3).replace(/^0/, '');
}

function calcOBP(s) {
  const denom = s.PA;
  if (denom === 0) return '.000';
  return ((s.H + s.BB) / denom).toFixed(3).replace(/^0/, '');
}

function calcOPS(s) {
  const obp = s.PA === 0 ? 0 : (s.H + s.BB) / s.PA;
  const singles = s.H - s.D - s.T - s.HR;
  const tb = singles + 2 * s.D + 3 * s.T + 4 * s.HR;
  const slg = s.AB === 0 ? 0 : tb / s.AB;
  return (obp + slg).toFixed(3).replace(/^0/, '');
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m, 10) - 1] + ' ' + parseInt(day, 10);
}

function displayName(name) {
  if (name.includes(', ')) { const [last, first] = name.split(', '); return first + ' ' + last; }
  return name;
}

// ── Per-game stats list for a player ──
function getPlayerGameStats(seasonData, pid, teamId) {
  return seasonData.games
    .filter(g => (g.homeTeamId === teamId || g.awayTeamId === teamId) && g.homeScore !== undefined)
    .sort((a, b) => a.date.localeCompare(b.date))
    .reduce((acc, g) => {
      const isHome = g.homeTeamId === teamId;
      const stats = isHome ? g.homeStats : g.awayStats;
      const ps = stats ? stats.find(x => x.playerId === pid) : null;
      if (ps) acc.push({ week: g.week, gameId: g.id, ...ps });
      return acc;
    }, []);
}

// ── AVG sparkline SVG ──
function sparklineSVG(gameStats) {
  if (gameStats.length < 2) return '';
  const W = 280, H = 56, PAD = 12;
  let cumH = 0, cumAB = 0;
  const pts = gameStats.map((gs, i) => {
    cumH += gs.H; cumAB += gs.AB;
    const avg = cumAB > 0 ? cumH / cumAB : 0;
    const x = PAD + (gameStats.length === 1 ? W/2 : (i / (gameStats.length - 1)) * W);
    const y = PAD + (1 - avg) * H;
    return { x, y, avg };
  });
  const first = pts[0], last = pts[pts.length - 1];
  const up = last.avg >= first.avg;
  const color = up ? '#22a861' : '#e4002b';
  const polyline = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = [`${first.x.toFixed(1)},${(PAD + H + 4).toFixed(1)}`,
    ...pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`),
    `${last.x.toFixed(1)},${(PAD + H + 4).toFixed(1)}`].join(' ');
  const fmtA = v => v.toFixed(3).replace(/^0/, '');
  const trendLabel = (up ? '▲' : '▼') + ' ' + fmtA(last.avg);
  return `<div class="sparkline-wrap">
    <div class="sparkline-label">AVG TRAJECTORY &nbsp;<span class="sparkline-trend ${up?'up':'down'}">${trendLabel}</span></div>
    <svg viewBox="0 0 ${W+PAD*2} ${H+PAD*2+18}" style="width:100%;max-width:380px;display:block;overflow:visible">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="${area}" fill="url(#sg)"/>
      <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => i === 0 || i === pts.length - 1 ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}" stroke="var(--white)" stroke-width="1.5"/>` : '').join('')}
      <text x="${first.x.toFixed(1)}" y="${(PAD+H+16).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${fmtA(first.avg)}</text>
      <text x="${last.x.toFixed(1)}" y="${(PAD+H+16).toFixed(1)}" text-anchor="middle" font-size="9" fill="${color}" font-weight="700">${fmtA(last.avg)}</text>
      ${pts.filter((_, i) => i > 0 && i < pts.length - 1).map(p =>
        `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${color}" opacity=".5"/>`).join('')}
    </svg>
  </div>`;
}

// ── Career bar chart (multi-season) ──
function careerChartHtml(allSeasons, currentSeason) {
  if (allSeasons.length < 2) return '';
  const maxAVG = Math.max(...allSeasons.map(os => os.player.seasonStats.AB > 0 ? os.player.seasonStats.H / os.player.seasonStats.AB : 0), 0.001);
  const maxOPS = Math.max(...allSeasons.map(os => parseFloat(calcOPS(os.player.seasonStats))), 0.001);
  const rows = allSeasons.map(os => {
    const ps = os.player.seasonStats;
    const avg = ps.AB > 0 ? ps.H / ps.AB : 0;
    const ops = parseFloat(calcOPS(ps));
    const avgW = Math.round((avg / maxAVG) * 100);
    const opsW = Math.round((ops / maxOPS) * 100);
    const isCur = os.seasonId === currentSeason;
    return `<div class="cc-row">
      <div class="cc-season">${os.seasonLabel}${isCur ? ' <span style="font-size:9px;color:var(--mlb-red);font-weight:800">NOW</span>' : ''}</div>
      <div class="cc-bars">
        <div class="cc-bar-row"><span class="cc-bar-key">AVG</span><div class="cc-bar-track"><div class="cc-bar-fill" style="width:${avgW}%"></div></div><span class="cc-bar-val">${avg.toFixed(3).replace(/^0/,'')}</span></div>
        <div class="cc-bar-row"><span class="cc-bar-key">OPS</span><div class="cc-bar-track"><div class="cc-bar-fill ops" style="width:${opsW}%"></div></div><span class="cc-bar-val">${ops.toFixed(3).replace(/^0/,'')}</span></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-header">Career at a Glance</div>
    <div class="card-body"><div class="career-chart">${rows}</div></div>
  </div>`;
}

// ── Awards panel (season) ──
function awardsPanelHtml() {
  // Only show awards when the season is complete (no unplayed games remain)
  const seasonComplete = DATA.games.every(g => g.homeScore !== undefined);
  if (!seasonComplete) return '';

  // Qualification: player must have played in at least half the games their team played
  const teamGamesPlayed = {};
  DATA.teams.forEach(t => {
    teamGamesPlayed[t.id] = DATA.games.filter(g =>
      (g.homeTeamId === t.id || g.awayTeamId === t.id) && g.homeScore !== undefined
    ).length;
  });
  const qualified = DATA.players.filter(p => {
    const tgp = teamGamesPlayed[p.teamId] || 0;
    return tgp > 0 && p.seasonStats.G >= tgp / 2;
  });

  // Return all tied winners for a given scoring function
  function topAll(list, fn, lowerBetter) {
    if (!list.length) return [];
    const sorted = [...list].sort((a, b) => lowerBetter ? fn(a) - fn(b) : fn(b) - fn(a));
    const best = fn(sorted[0]);
    return sorted.filter(p => fn(p) === best);
  }

  // MVP composite: normalize OPS (40%), SLG (30%), Runs (30%) to 0-1 then weight
  const maxOPS = Math.max(...qualified.map(p => parseFloat(calcOPS(p.seasonStats))), 0.001);
  const maxSLG = Math.max(...qualified.map(p => parseFloat(calcSLG(p.seasonStats))), 0.001);
  const maxR   = Math.max(...qualified.map(p => p.seasonStats.R), 1);
  const mvpScore = p => (parseFloat(calcOPS(p.seasonStats)) / maxOPS) * 0.40
                      + (parseFloat(calcSLG(p.seasonStats)) / maxSLG) * 0.30
                      + (p.seasonStats.R / maxR) * 0.30;
  const mvpWinners     = topAll(qualified, mvpScore);
  const bavgWinners    = topAll(qualified, p => p.seasonStats.AB > 0 ? p.seasonStats.H / p.seasonStats.AB : 0);
  const clutchWinners  = topAll(qualified, p => p.seasonStats.BI);
  const scorerWinners  = topAll(qualified, p => p.seasonStats.R);
  const xbhWinners     = topAll(qualified, p => p.seasonStats.D + p.seasonStats.T + p.seasonStats.HR);
  const ironWinners    = topAll(qualified, p => p.seasonStats.G);

  function awardStat(winners, fn) {
    if (!winners.length) return '—';
    const p = winners[0], s = p.seasonStats;
    return fn(p, s);
  }

  const awards = [
    { icon: '\uD83C\uDFC6', label: 'MVP',          winners: mvpWinners,    stat: awardStat(mvpWinners,    p => calcOPS(p.seasonStats) + ' OPS \u00B7 ' + calcSLG(p.seasonStats) + ' SLG \u00B7 ' + p.seasonStats.R + ' R') },
    { icon: '\uD83E\uDD47', label: 'BATTING CHAMP', winners: bavgWinners,   stat: awardStat(bavgWinners,   p => calcAVG(p.seasonStats.H, p.seasonStats.AB) + ' AVG') },
    { icon: '\uD83D\uDD25', label: 'MR. CLUTCH',    winners: clutchWinners, stat: awardStat(clutchWinners, p => p.seasonStats.BI + ' RBI') },
    { icon: '\u26A1',       label: 'SPEEDSTER',     winners: scorerWinners, stat: awardStat(scorerWinners, p => p.seasonStats.R + ' runs') },
    { icon: '\uD83D\uDCA5', label: 'XBH LEADER',    winners: xbhWinners,    stat: awardStat(xbhWinners,    p => (p.seasonStats.D+p.seasonStats.T+p.seasonStats.HR) + ' extra-base hits') },
    { icon: '\uD83D\uDEE1\uFE0F', label: 'IRON MAN', winners: ironWinners,  stat: awardStat(ironWinners,   p => p.seasonStats.G + ' games') },
  ];

  const itemsHtml = awards.map(a => {
    const playersHtml = a.winners.length
      ? a.winners.map(p => {
          const t = getTeam(p.teamId);
          return `<div class="award-winner-row"><a href="#/player/${p.id}">${displayName(p.name)}</a>${t ? ` <span class="award-team-name">${teamLogoImg(t.id)}<span class="award-team-name-text">${t.name}</span></span>` : ''}</div>`;
        }).join('')
      : '—';
    return `<div class="award-item">
      <div class="award-icon">${a.icon}</div>
      <div class="award-label">${a.label}</div>
      <div class="award-player">${playersHtml}</div>
      <div class="award-stat">${a.stat}</div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="card-header">Season Awards</div>
    <div class="card-body"><div class="awards-grid">${itemsHtml}</div></div>
  </div>`;
}

// ── Achievement badges ──
function playerBadges(player) {
  const all = DATA.players;
  const s = player.seasonStats;
  const badges = [];

  // League leader checks
  const leaderAVG = [...all].filter(p => p.seasonStats.AB > 0).sort((a,b) => (b.seasonStats.H/b.seasonStats.AB) - (a.seasonStats.H/a.seasonStats.AB))[0];
  const leaderH   = [...all].sort((a,b) => b.seasonStats.H - a.seasonStats.H)[0];
  const leaderHR  = [...all].sort((a,b) => b.seasonStats.HR - a.seasonStats.HR)[0];
  const leaderRBI = [...all].sort((a,b) => b.seasonStats.BI - a.seasonStats.BI)[0];
  const leaderR   = [...all].sort((a,b) => b.seasonStats.R - a.seasonStats.R)[0];
  const leaderOPS = [...all].filter(p => p.seasonStats.PA >= 3).sort((a,b) => parseFloat(calcOPS(b.seasonStats)) - parseFloat(calcOPS(a.seasonStats)))[0];

  if (leaderAVG && leaderAVG.id === player.id && s.AB >= 3) badges.push({ label: 'AVG Leader', cls: 'gold', icon: '\uD83C\uDFC6', tip: 'Highest batting average in the league (min. 3 AB)' });
  if (leaderH   && leaderH.id   === player.id && s.H > 0)  badges.push({ label: 'Hit Leader', cls: 'gold', icon: '\uD83D\uDCA5', tip: 'Most hits in the league this season' });
  if (leaderHR  && leaderHR.id  === player.id && s.HR > 0) badges.push({ label: 'HR Leader', cls: 'fire', icon: '\uD83D\uDCA3', tip: 'Most home runs in the league this season' });
  if (leaderRBI && leaderRBI.id === player.id && s.BI > 0) badges.push({ label: 'RBI Leader', cls: 'fire', icon: '\uD83D\uDD25', tip: 'Most RBI in the league this season' });
  if (leaderR   && leaderR.id   === player.id && s.R > 0)  badges.push({ label: 'Runs Leader', cls: 'blue', icon: '\u26A1', tip: 'Most runs scored in the league this season' });
  if (leaderOPS && leaderOPS.id === player.id && s.PA >= 3) badges.push({ label: 'OPS Leader', cls: 'gold', icon: '\u2B50', tip: 'Highest OBP + SLG in the league (min. 3 PA)' });

  // Stat-based badges
  if (s.G >= 2 && s.D >= s.G / 2)        badges.push({ label: 'Gap Machine', cls: 'blue', icon: '\uD83C\uDFD3', tip: `${s.D} doubles in ${s.G} games — at least one every other game` });
  if (s.G >= 2 && s.BI / s.G >= 2)       badges.push({ label: 'Run Producer', cls: 'fire', icon: '\uD83D\uDCA5', tip: `${s.BI} RBI in ${s.G} games (${(s.BI/s.G).toFixed(1)} per game) — elite run production` });
  if (s.G >= 2 && s.R / s.G >= 1)        badges.push({ label: 'Runs Scored', cls: 'blue', icon: '\uD83C\uDFC3', tip: `${s.R} runs in ${s.G} games (${(s.R/s.G).toFixed(1)} per game) — scoring at an elite clip` });
  if (s.G >= 2 && s.BB / s.G >= 0.25)    badges.push({ label: 'Eye at the Plate', cls: '', icon: '\uD83D\uDC40', tip: `${s.BB} walks in ${s.G} games — exceptional patience in a free-swinging league` });
  if (s.HR >= 1)                         badges.push({ label: 'Went Yard', cls: 'fire', icon: '\uD83D\uDE80', tip: 'Hit at least one home run this season' });
  if (s.T >= 1)                          badges.push({ label: 'Triple Threat', cls: 'blue', icon: '\u26A1', tip: 'Hit at least one triple this season — rare in slowpitch!' });
  if (s.AB > 0 && s.H / s.AB >= 0.700 && s.AB < 5) badges.push({ label: '.700 Club', cls: 'gold', icon: '\uD83D\uDCC8', tip: 'Batting .700 or better this season' });
  if (s.AB >= 5 && s.H / s.AB >= 0.600) badges.push({ label: '.600 Club', cls: 'gold', icon: '\uD83D\uDCC8', tip: 'Batting .600 or better with 5+ AB — elite even in slowpitch' });
  if (s.AB > 0 && s.H / s.AB >= 1.0)    badges.push({ label: 'Perfect Avg', cls: 'gold', icon: '\uD83D\uDCAF', tip: 'Has not made an out yet this season (1.000 AVG)' });
  if (s.G >= 2)                          badges.push({ label: 'Iron Man', cls: '', icon: '\uD83D\uDEE1\uFE0F', tip: 'Appeared in every game so far this season' });

  if (badges.length === 0) return '';
  return `<div class="badges">${badges.slice(0, 6).map(b => `<span class="badge ${b.cls}" data-tip="${b.tip}">${b.icon} ${b.label}</span>`).join('')}</div>`;
}

// ── Compare page ──
function buildCompareStatsHtml(p1id, p2id) {
  const p1 = getPlayer(p1id), p2 = getPlayer(p2id);
  if (!p1 || !p2) return '';
  const t1 = getTeam(p1.teamId), t2 = getTeam(p2.teamId);
  const cs = (p) => ({
    ...p.seasonStats,
    AVG: parseFloat(calcAVG(p.seasonStats.H, p.seasonStats.AB)),
    SLG: parseFloat(calcSLG(p.seasonStats)),
    OPS: parseFloat(calcOPS(p.seasonStats)),
  });
  const s1 = cs(p1), s2 = cs(p2);
  const statKeys = [
    { key: 'G', label: 'G', title: 'Games' },
    { key: 'PA', label: 'PA', title: 'Plate Appearances' },
    { key: 'AB', label: 'AB', title: 'At Bats' },
    { key: 'H', label: 'H', title: 'Hits' },
    { key: 'R', label: 'R', title: 'Runs' },
    { key: 'D', label: '2B', title: 'Doubles' },
    { key: 'T', label: '3B', title: 'Triples' },
    { key: 'HR', label: 'HR', title: 'Home Runs' },
    { key: 'BB', label: 'BB', title: 'Walks' },
    { key: 'BI', label: 'RBI', title: 'Runs Batted In' },
    { key: 'E', label: 'E', title: 'Errors', lowerBetter: true },
    { key: 'AVG', label: 'AVG', title: 'Batting Average', fmt: v => v.toFixed(3).replace(/^0/,'') },
    { key: 'SLG', label: 'SLG', title: 'Slugging Pct', fmt: v => v.toFixed(3).replace(/^0/,'') },
    { key: 'OPS', label: 'OPS', title: 'On-base + Slugging', fmt: v => v.toFixed(3).replace(/^0/,'') },
  ];
  const rows = statKeys.map(k => {
    const v1 = s1[k.key] || 0, v2 = s2[k.key] || 0;
    const fmt = k.fmt || (v => v);
    const better1 = k.lowerBetter ? v1 < v2 : v1 > v2;
    const better2 = k.lowerBetter ? v2 < v1 : v2 > v1;
    const tie = v1 === v2;
    return `<tr>
      <td><span class="c-val ${!tie && better1 ? 'c-win-blue' : ''}">${fmt(v1)}</span></td>
      <td class="c-label" title="${k.title}">${k.label}</td>
      <td><span class="c-val ${!tie && better2 ? 'c-win' : ''}">${fmt(v2)}</span></td>
    </tr>`;
  }).join('');
  return `<div class="compare-result">
    <div class="compare-result-header">
      <div class="p-col">
        <img src="${avatarUrl(p1.name, 42)}" alt="">
        <div>
          <div class="p-name"><a href="#/player/${p1.id}" style="color:white;text-decoration:none">${displayName(p1.name)}</a></div>
          <div class="p-team">${t1 ? t1.name : ''}</div>
        </div>
      </div>
      <div class="vs-col">VS</div>
      <div class="p-col">
        <img src="${avatarUrl(p2.name, 42)}" alt="">
        <div>
          <div class="p-name"><a href="#/player/${p2.id}" style="color:white;text-decoration:none">${displayName(p2.name)}</a></div>
          <div class="p-team">${t2 ? t2.name : ''}</div>
        </div>
      </div>
    </div>
    <table class="compare-stats-table"><tbody>${rows}</tbody></table>
  </div>`;
}

function viewCompare(p1id, p2id) {
  const allPlayers = [...DATA.players].sort((a, b) => displayName(a.name).localeCompare(displayName(b.name)));
  const optionsHtml = allPlayers.map(p => {
    const t = getTeam(p.teamId);

  }).join('');

  document.getElementById('app').innerHTML = `

    <div class="page-subtitle">Select two players to compare their stats head-to-head</div>
    <div class="compare-pickers">
      <div class="compare-picker-card${p1id ? ' selected' : ''}" id="picker-card-1">
        <div class="compare-picker-header">PLAYER 1</div>
        <div class="compare-picker-inner">
          <input class="compare-filter" placeholder="Filter by name…" oninput="filterCompareSelect('sel-1', this.value)" autocomplete="off">
          <select id="sel-1" class="compare-select" size="8" onchange="onComparePick(1, this.value)">
            ${optionsHtml}
          </select>
        </div>
      </div>
      <div class="compare-picker-card${p2id ? ' selected' : ''}" id="picker-card-2">
        <div class="compare-picker-header">PLAYER 2</div>
        <div class="compare-picker-inner">
          <input class="compare-filter" placeholder="Filter by name…" oninput="filterCompareSelect('sel-2', this.value)" autocomplete="off">
          <select id="sel-2" class="compare-select" size="8" onchange="onComparePick(2, this.value)">
            ${optionsHtml}
          </select>
        </div>
      </div>
    </div>
    <div id="compare-output"></div>
  `;

  window._compareAllOptions = allPlayers;
  window.filterCompareSelect = function(selId, q) {
    const sel = document.getElementById(selId);
    const filtered = q.trim() === ''
      ? allPlayers
      : allPlayers.filter(p => displayName(p.name).toLowerCase().includes(q.toLowerCase()) || (getTeam(p.teamId) || {name:''}).name.toLowerCase().includes(q.toLowerCase()));
    sel.innerHTML = filtered.map(p => {
      const t = getTeam(p.teamId);
      return `<option value="${p.id}">${displayName(p.name)} — ${t ? t.name : ''}</option>`;
    }).join('');
    // Re-apply selection if still visible
    const curP1 = window._compareP1, curP2 = window._compareP2;
    if (selId === 'sel-1' && curP1 && filtered.find(p => p.id === curP1)) sel.value = curP1;
    if (selId === 'sel-2' && curP2 && filtered.find(p => p.id === curP2)) sel.value = curP2;
  };
  window.onComparePick = function(slot, pid) {
    if (slot === 1) window._compareP1 = pid;
    else window._compareP2 = pid;
    document.getElementById(`picker-card-${slot}`).classList.add('selected');
    const out = document.getElementById('compare-output');
    const p1 = window._compareP1, p2 = window._compareP2;
    if (p1 && p2 && p1 !== p2) {
      out.innerHTML = buildCompareStatsHtml(p1, p2);
      history.replaceState(null, '', `#/compare/${p1}/${p2}`);
    } else {
      out.innerHTML = '';
    }
  };

  // Pre-select if IDs passed in URL
  if (p1id) {
    window._compareP1 = p1id;
    const sel1 = document.getElementById('sel-1');
    if (sel1) sel1.value = p1id;
  }
  if (p2id) {
    window._compareP2 = p2id;
    const sel2 = document.getElementById('sel-2');
    if (sel2) sel2.value = p2id;
  }
  if (p1id && p2id && p1id !== p2id) {
    document.getElementById('compare-output').innerHTML = buildCompareStatsHtml(p1id, p2id);
  }
}

// Find same player across all seasons by ID
function findPlayerAcrossSeasons(playerId) {
  const results = [];
  for (const [seasonId, seasonData] of Object.entries(SEASONS)) {
    const p = seasonData.players.find(pl => pl.id === playerId);
    if (p) {
      const team = seasonData.teams.find(t => t.id === p.teamId);
      results.push({ seasonId, seasonLabel: SEASON_LABELS[seasonId], player: p, team });
    }
  }
  return results;
}

function sortableTable(id, data, columns, defaultSort, defaultDir) {
  let sortCol = defaultSort || columns[0].key;
  let sortDir = defaultDir || 'desc';

  function render() {
    const sorted = [...data].sort((a, b) => {
      let va = typeof columns.find(c => c.key === sortCol).val === 'function'
        ? columns.find(c => c.key === sortCol).val(a) : a[sortCol];
      let vb = typeof columns.find(c => c.key === sortCol).val === 'function'
        ? columns.find(c => c.key === sortCol).val(b) : b[sortCol];
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    const thead = columns.map(c => {
      const cls = [c.num ? 'num' : '', 'sortable', sortCol === c.key ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : ''].filter(Boolean).join(' ');
      return `<th class="${cls}" data-col="${c.key}">${c.label}</th>`;
    }).join('');

    const tbody = sorted.map(row => {
      return '<tr>' + columns.map(c => {
        const val = typeof c.render === 'function' ? c.render(row) : (typeof c.val === 'function' ? c.val(row) : row[c.key]);
        return `<td class="${c.num ? 'num' : ''}">${val}</td>`;
      }).join('') + '</tr>';
    }).join('');

    document.getElementById(id).innerHTML = `<div class="table-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;

    document.querySelectorAll(`#${id} th.sortable`).forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortCol = col; sortDir = 'desc'; }
        render();
      });
    });
  }
  render();
}

function pctDisplay(w, l, t) {
  const games = w + l + t;
  if (games === 0) return '.000';
  return ((w + t * 0.5) / games).toFixed(3).replace(/^0/, '');
}

function viewStandings() {
  const teams = DATA.teams.map(t => {
    const tp = getTeamPlayers(t.id);
    const sum = (key) => tp.reduce((s, p) => s + p.seasonStats[key], 0);
    const ab = sum('AB'), h = sum('H'), bb = sum('BB'), pa = sum('PA');
    const d = sum('D'), tr = sum('T'), hr = sum('HR');
    const singles = h - d - tr - hr;
    const tb = singles + 2*d + 3*tr + 4*hr;
    const slg = ab === 0 ? 0 : tb / ab;
    const obp = pa === 0 ? 0 : (h + bb) / pa;
    return {
      ...t,
      gp: t.wins + t.losses + t.ties,
      pct: parseFloat(pctDisplay(t.wins, t.losses, t.ties)),
      rs: DATA.games.reduce((s, g) => {
        if (g.homeScore === undefined) return s;
        if (g.homeTeamId === t.id) return s + g.homeScore;
        if (g.awayTeamId === t.id) return s + g.awayScore;
        return s;
      }, 0),
      ra: DATA.games.reduce((s, g) => {
        if (g.homeScore === undefined) return s;
        if (g.homeTeamId === t.id) return s + g.awayScore;
        if (g.awayTeamId === t.id) return s + g.homeScore;
        return s;
      }, 0),
      tAB: ab, tH: h, tR: sum('R'), tHR: hr, tBB: bb, tBI: sum('BI'), tE: sum('E'),
      tD: d, tT: tr,
      tAVG: ab === 0 ? 0 : h / ab,
      tSLG: slg,
      tOPS: obp + slg,
    };
  }).sort((a, b) => b.pct - a.pct || b.wins - a.wins || a.losses - b.losses);

  const fmtR = (v) => v.toFixed(3).replace(/^0/, '');

  const standingsRows = teams.map((t, i) => `<tr>
    <td class="num">${i + 1}</td>
    <td><a class="team-link" href="#/team/${t.id}">${teamLogoImg(t.id)}${t.name}</a></td>
    <td class="num">${t.wins}</td>
    <td class="num">${t.losses}</td>
    <td class="num">${t.ties}</td>
    <td class="num">${pctDisplay(t.wins, t.losses, t.ties)}</td>
    <td class="num">${t.rs}</td>
    <td class="num">${t.ra}</td>
    <td class="num">${t.tAB}</td>
    <td class="num">${t.tH}</td>
    <td class="num">${t.tR}</td>
    <td class="num">${t.tD}</td>
    <td class="num">${t.tT}</td>
    <td class="num">${t.tHR}</td>
    <td class="num">${t.tBB}</td>
    <td class="num">${t.tBI}</td>
    <td class="num">${t.tE}</td>
    <td class="num">${fmtR(t.tAVG)}</td>
    <td class="num">${fmtR(t.tSLG)}</td>
    <td class="num">${fmtR(t.tOPS)}</td>
  </tr>`).join('');

  // League leaders — player must have played at least half their team's games
  const leaderTeamGP = {};
  DATA.teams.forEach(t => {
    leaderTeamGP[t.id] = DATA.games.filter(g =>
      (g.homeTeamId === t.id || g.awayTeamId === t.id) && g.homeScore !== undefined
    ).length;
  });
  const leaderPool = DATA.players.filter(p => {
    const tgp = leaderTeamGP[p.teamId] || 0;

function ordinal(n) {
  if (typeof n === 'string') return n;
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function playerRankings(player) {
  const all = DATA.players;
  function rank(sortFn) {
    const sorted = [...all].sort(sortFn);
    const idx = sorted.findIndex(p => p.id === player.id);
    return ordinal(idx + 1);
  }
  const cats = [
    rank((a, b) => b.seasonStats.H - a.seasonStats.H),
    rank((a, b) => {
      const aa = a.seasonStats.AB === 0 ? 0 : a.seasonStats.H / a.seasonStats.AB;
      const bb = b.seasonStats.AB === 0 ? 0 : b.seasonStats.H / b.seasonStats.AB;
      return bb - aa;
    }),
    rank((a, b) => b.seasonStats.R - a.seasonStats.R),
    rank((a, b) => b.seasonStats.D - a.seasonStats.D),
    rank((a, b) => b.seasonStats.T - a.seasonStats.T),
    rank((a, b) => b.seasonStats.HR - a.seasonStats.HR),
    rank((a, b) => b.seasonStats.BB - a.seasonStats.BB),
    rank((a, b) => b.seasonStats.SF - a.seasonStats.SF),
  ];
  return cats.map(r => `<td class="num">${r}</td>`).join('');
}

function viewPlayer(playerId) {
  const player = getPlayer(playerId);
  if (!player) { document.getElementById('app').innerHTML = '<p>Player not found.</p>'; return; }
  const team = getTeam(player.teamId);
  const s = player.seasonStats;

  // Build game log for current season
  function buildGameLog(seasonId, seasonData, playerId, teamId) {
    const gamesWithStats = [];
    const gamesWithoutStats = [];

    const teamGames = seasonData.games.filter(g => g.homeTeamId === teamId || g.awayTeamId === teamId)
      .sort((a, b) => a.date.localeCompare(b.date));

    teamGames.forEach(g => {
      if (g.homeScore === undefined) return; // skip unplayed future games
      const isHome = g.homeTeamId === teamId;
      const stats = isHome ? g.homeStats : g.awayStats;
      const ps = stats ? stats.find(x => x.playerId === playerId) : null;
      const oppId = isHome ? g.awayTeamId : g.homeTeamId;
      const opp = seasonData.teams.find(t => t.id === oppId);
      const teamScore = isHome ? g.homeScore : g.awayScore;
      const oppScore = isHome ? g.awayScore : g.homeScore;
      const result = teamScore > oppScore ? 'W' : teamScore < oppScore ? 'L' : 'T';

      if (ps) {
        gamesWithStats.push(`<tr>
          <td><a href="#/schedule/week/${g.week}">Wk ${g.week}</a></td>
          <td>${isHome ? 'vs' : '@'} <a class="team-link" href="#/team/${opp ? opp.id : ''}">${opp ? teamLogoImg(opp.id) + opp.name : 'Unknown'}</a></td>
          <td class="num"><a href="#/game/${g.id}">${result} ${teamScore}-${oppScore}</a></td>
          <td class="num">${ps.PA}</td>
          <td class="num">${ps.AB}</td>
          <td class="num">${ps.H}</td>
          <td class="num">${ps.R}</td>
          <td class="num">${ps.D}</td>
          <td class="num">${ps.T}</td>
          <td class="num">${ps.HR}</td>
          <td class="num">${ps.BB}</td>
          <td class="num">${ps.SF}</td>
          <td class="num">${ps.BI}</td>
          <td class="num">${ps.E}</td>
          <td class="num">${calcAVG(ps.H, ps.AB)}</td>
        </tr>`);
      } else {
        gamesWithoutStats.push(`<tr>
          <td><a href="#/schedule/week/${g.week}">Wk ${g.week}</a></td>
          <td>${isHome ? 'vs' : '@'} <a class="team-link" href="#/team/${opp ? opp.id : ''}">${opp ? teamLogoImg(opp.id) + opp.name : 'Unknown'}</a></td>
          <td class="num"><a href="#/game/${g.id}">${result} ${teamScore}-${oppScore}</a></td>
        </tr>`);
      }
    });

    return { withStats: gamesWithStats, withoutStats: gamesWithoutStats, total: teamGames.length };
  }

  // Compute hot/cold streak from raw game data
  function computeStreak(seasonData, pid, teamId) {
    const recentStats = getPlayerGameStats(seasonData, pid, teamId);
    if (recentStats.length < 3) return null;
    const last3 = recentStats.slice(-3);
    // Slowpitch softball: hitting is easy, so thresholds are much stricter
    // HOT: got hits in all 3 of the last 3 games AND went multi-hit (2+) in at least 2 of them
    const allLast3HadHits = last3.every(ps => ps.H > 0);
    const multiHitGamesInLast3 = last3.filter(ps => ps.H >= 2).length;
    if (allLast3HadHits && multiHitGamesInLast3 >= 2) return 'hot';
    // COLD: batting under .400 over the last 3 games (meaningfully below average in slowpitch)
    const last3H = last3.reduce((s, ps) => s + ps.H, 0);
    const last3AB = last3.reduce((s, ps) => s + ps.AB, 0);
    if (last3AB >= 3 && last3H / last3AB < 0.400) return 'cold';
    return null;
  }
  const streak = computeStreak(DATA, playerId, player.teamId);

  const currentLog = buildGameLog(currentSeason, DATA, playerId, player.teamId);
  const hasDetailedLog = currentLog.withStats.length > 0;
  const gameLogRows = hasDetailedLog
    ? currentLog.withStats.join('')
    : (currentLog.withoutStats.length > 0 ? currentLog.withoutStats.join('') : '');

  // Find this player in all seasons, sort chronologically (ascending)
  const SEASON_ORDER = ['spring-2023', 'spring-2024', 'fall-2024', 'spring-2025', 'fall-2025', 'spring-2026'];
  const allSeasons = findPlayerAcrossSeasons(playerId);
  allSeasons.sort((a, b) => SEASON_ORDER.indexOf(a.seasonId) - SEASON_ORDER.indexOf(b.seasonId));

  // Compute career bests for each stat column (only highlight if >1 season)
  const careerBest = {};
  if (allSeasons.length > 1) {
    const numKeys = ['G','PA','AB','H','R','D','T','HR','BB','SF','BI'];
    numKeys.forEach(k => { careerBest[k] = Math.max(...allSeasons.map(os => os.player.seasonStats[k] || 0)); });
    careerBest.AVG = Math.max(...allSeasons.map(os => parseFloat(calcAVG(os.player.seasonStats.H, os.player.seasonStats.AB))));
    careerBest.SLG = Math.max(...allSeasons.map(os => parseFloat(calcSLG(os.player.seasonStats))));
    careerBest.OPS = Math.max(...allSeasons.map(os => parseFloat(calcOPS(os.player.seasonStats))));
  }
  function b(val, key) {
    if (!careerBest[key]) return val;
    const num = parseFloat(val);
    return (num > 0 && num === careerBest[key]) ? `<strong>${val}</strong>` : val;
  }

  const seasonRows = allSeasons.map(os => {
    const ps = os.player.seasonStats;
    const isCurrent = os.seasonId === currentSeason;
    const label = isCurrent
      ? `<a href="#/"><strong>${os.seasonLabel}</strong></a>`
      : `<a href="#" onclick="switchSeason('${os.seasonId}');location.hash='#/';return false;">${os.seasonLabel}</a>`;
    const teamLink = isCurrent
      ? `<a class="team-link" href="#/team/${os.player.teamId}">${os.team ? teamLogoImg(os.player.teamId) + os.team.name : ''}</a>`
      : `<a class="team-link" href="#" onclick="switchSeason('${os.seasonId}');location.hash='#/team/${os.player.teamId}';return false;">${os.team ? teamLogoImg(os.player.teamId) + os.team.name : ''}</a>`;
    return `<tr>
      <td>${label}</td>
      <td>${teamLink}</td>
      <td class="num">${b(ps.G,'G')}</td><td class="num">${b(ps.PA,'PA')}</td><td class="num">${b(ps.AB,'AB')}</td>
      <td class="num">${b(ps.H,'H')}</td><td class="num">${b(ps.R,'R')}</td>
      <td class="num">${b(ps.D,'D')}</td><td class="num">${b(ps.T,'T')}</td><td class="num">${b(ps.HR,'HR')}</td>
      <td class="num">${b(ps.BB,'BB')}</td><td class="num">${b(ps.SF,'SF')}</td><td class="num">${b(ps.BI,'BI')}</td>
      <td class="num">${ps.E}</td>
      <td class="num">${b(calcAVG(ps.H,ps.AB),'AVG')}</td><td class="num">${b(calcSLG(ps),'SLG')}</td><td class="num">${b(calcOPS(ps),'OPS')}</td>
    </tr>`;
  }).join('');

  let totalsRow = '';
  if (allSeasons.length > 1) {
    const tot = { G:0, PA:0, AB:0, H:0, R:0, D:0, T:0, HR:0, BB:0, SF:0, BI:0, E:0 };
    allSeasons.forEach(os => {
      const ps = os.player.seasonStats;
      for (const k in tot) tot[k] += (ps[k] || 0);
    });
    totalsRow = `<tr style="font-weight:600;border-top:2px solid #ccc;">
      <td>Total</td><td></td>
      <td class="num">${tot.G}</td><td class="num">${tot.PA}</td><td class="num">${tot.AB}</td>
      <td class="num">${tot.H}</td><td class="num">${tot.R}</td>
      <td class="num">${tot.D}</td><td class="num">${tot.T}</td><td class="num">${tot.HR}</td>

      <td class="num">${calcAVG(tot.H, tot.AB)}</td><td class="num">${calcSLG(tot)}</td><td class="num">${calcOPS(tot)}</td>
    </tr>`;
  }

  const statsHeader = allSeasons.length > 1 ? 'Career Stats' : 'Season Stats';
  const statsHtml = `
  <div class="card">
    <div class="card-header">${statsHeader}</div>
    <div class="card-body"><div class="table-wrap">
      <table><thead><tr>

        <th class="num">2B</th><th class="num">3B</th><th class="num">HR</th><th class="num">BB</th><th class="num">SF</th>
        <th class="num">RBI</th><th class="num">E</th><th class="num">AVG</th><th class="num">SLG</th><th class="num">OPS</th>
      </tr></thead>
      <tbody>${seasonRows}${totalsRow}</tbody></table>
    </div></div>
  </div>`;

  const playerGameStats = getPlayerGameStats(DATA, playerId, player.teamId);
  const sparkHtml = playerGameStats.length >= 2 ? `<div class="card"><div class="card-body">${sparklineSVG(playerGameStats)}</div></div>` : '';
  const careerHtml = careerChartHtml(allSeasons, currentSeason);

  document.getElementById('app').innerHTML = `
    <div style="display:flex;align-items:center"><a class="back-link" href="#/team/${player.teamId}">&larr; ${team ? teamLogoImg(team.id) + team.name : ''}</a>${shareBtn()}</div>

          <th class="num">2B</th><th class="num">3B</th><th class="num">HR</th><th class="num">BB</th><th class="num">SF</th>
          <th class="num">RBI</th><th class="num">E</th><th class="num">AVG</th>` : ''}
        </tr></thead>
        <tbody>${gameLogRows}</tbody></table>
      </div></div>
    </div>
    <div class="card">
      <div class="card-header">League Rankings</div>
      <div class="card-body"><div class="table-wrap">
        <table><thead><tr>
          <th class="num">H</th><th class="num">AVG</th><th class="num">R</th><th class="num">2B</th><th class="num">3B</th><th class="num">HR</th><th class="num">BB</th><th class="num">SF</th>
        </tr></thead>
        <tbody><tr>
          ${playerRankings(player)}

    ${sparkHtml}

  `;
}

function buildTeamSeasonStats(teamId) {
  const players = getTeamPlayers(teamId);
  const sum = k => players.reduce((s, p) => s + (p.seasonStats[k] || 0), 0);
  const H = sum('H'), AB = sum('AB'), BB = sum('BB'), PA = sum('PA');
  const D = sum('D'), T = sum('T'), HR = sum('HR');
  const singles = H - D - T - HR;
  const TB = singles + 2*D + 3*T + 4*HR;
  const games = getTeamGames(teamId).filter(g => g.homeScore !== undefined).length;
  const team = getTeam(teamId);
  const RS = DATA.games.reduce((s, g) => {
    if (!g.homeScore) return s;
    if (g.homeTeamId === teamId) return s + g.homeScore;
    if (g.awayTeamId === teamId) return s + g.awayScore;
    return s;
  }, 0);
  const RA = DATA.games.reduce((s, g) => {
    if (!g.homeScore) return s;
    if (g.homeTeamId === teamId) return s + g.awayScore;
    if (g.awayTeamId === teamId) return s + g.homeScore;
    return s;
  }, 0);
  return {
    name: team ? team.name : teamId,
    W: team ? team.wins : 0, L: team ? team.losses : 0, T: team ? team.ties : 0,
    G: games, RS, RA, H, AB, BB, PA, D, T: T, HR,
    AVG: AB > 0 ? H / AB : 0,
    SLG: AB > 0 ? TB / AB : 0,
    OBP: PA > 0 ? (H + BB) / PA : 0,
    OPS: (PA > 0 ? (H + BB) / PA : 0) + (AB > 0 ? TB / AB : 0),
    RPG: games > 0 ? RS / games : 0,
    RAPG: games > 0 ? RA / games : 0,
  };
}

function viewGamePreview(game) {
  const home = getTeam(game.homeTeamId);
  const away = getTeam(game.awayTeamId);
  const hs = buildTeamSeasonStats(game.homeTeamId);
  const as_ = buildTeamSeasonStats(game.awayTeamId);

  const fmtAvg = v => v.toFixed(3).replace(/^0/, '');
  const fmtRec = t => t.T > 0 ? `${t.W}-${t.L}-${t.T}` : `${t.W}-${t.L}`;

  // Team comparison rows — v1 = away (left column), v2 = home (right column), matching the header
  const cmpRows = [
    { label: 'Record', v1: fmtRec(as_), v2: fmtRec(hs), num: false },
    { label: 'Avg / Game', v1: as_.RPG.toFixed(1), v2: hs.RPG.toFixed(1), higher: 'better' },
    { label: 'Team AVG', v1: fmtAvg(as_.AVG), v2: fmtAvg(hs.AVG), higher: 'better' },
    { label: 'Team SLG', v1: fmtAvg(as_.SLG), v2: fmtAvg(hs.SLG), higher: 'better' },
    { label: 'Team OPS', v1: fmtAvg(as_.OPS), v2: fmtAvg(hs.OPS), higher: 'better' },
    { label: 'Runs Allowed / G', v1: as_.RAPG.toFixed(1), v2: hs.RAPG.toFixed(1), higher: 'worse' },
    { label: 'HR', v1: as_.HR, v2: hs.HR, higher: 'better' },
    { label: '2B', v1: as_.D, v2: hs.D, higher: 'better' },
    { label: '3B', v1: as_.T, v2: hs.T, higher: 'better' },
    { label: 'BB', v1: as_.BB, v2: hs.BB, higher: 'neutral' },
  ].map(r => {
    const n1 = parseFloat(r.v1), n2 = parseFloat(r.v2);
    const tie = isNaN(n1) || isNaN(n2) || n1 === n2 || r.higher === 'neutral' || r.num === false;
    const win1 = !tie && (r.higher === 'better' ? n1 > n2 : n1 < n2);
    const win2 = !tie && (r.higher === 'better' ? n2 > n1 : n2 < n1);
    return `<tr>
      <td style="text-align:right;font-weight:${win1?'800':'400'};color:${win1?'var(--mlb-blue)':'var(--text)'}">${r.v1}</td>
      <td style="text-align:center;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--text-muted);background:var(--row-alt);padding:8px 12px">${r.label}</td>
      <td style="text-align:left;font-weight:${win2?'800':'400'};color:${win2?'var(--mlb-red)':'var(--text)'}">${r.v2}</td>
    </tr>`;
  }).join('');

  // Key players per team
  function keyPlayers(teamId) {
    const players = getTeamPlayers(teamId).filter(p => p.seasonStats.AB > 0);
    const byAVG = [...players].sort((a, b) => (b.seasonStats.AB > 0 ? b.seasonStats.H/b.seasonStats.AB : 0) - (a.seasonStats.AB > 0 ? a.seasonStats.H/a.seasonStats.AB : 0));
    const byRBI = [...players].sort((a, b) => b.seasonStats.BI - a.seasonStats.BI);
    const byHR  = [...players].filter(p => p.seasonStats.HR > 0).sort((a, b) => b.seasonStats.HR - a.seasonStats.HR);
    // Pick top 3 unique players: best AVG + best RBI (if different) + best HR (if different)
    const seen = new Set();
    const picks = [];
    for (const p of [...byAVG, ...byRBI, ...byHR]) {
      if (!seen.has(p.id)) { seen.add(p.id); picks.push(p); }
      if (picks.length >= 3) break;
    }
    return picks.map(p => {
      const s = p.seasonStats;
      const avg = s.AB > 0 ? fmtAvg(s.H / s.AB) : '.000';
      return `<div class="key-player-item">
        <img src="${avatarUrl(p.name, 28)}" alt="">
        <span class="kp-name"><a class="player-link" href="#/player/${p.id}">${displayName(p.name)}</a></span>
        <span class="kp-stat">${avg} AVG</span>
        <span class="kp-val">${s.H}H ${s.BI}RBI</span>
      </div>`;
    }).join('');
  }

  // Written preview analysis
  function writePreview(ts1, ts2, t1, t2) {
    const name1 = t1 ? t1.name : 'Home';
    const name2 = t2 ? t2.name : 'Away';
    const avgEdge = ts1.AVG > ts2.AVG ? name1 : ts2.AVG > ts1.AVG ? name2 : null;
    const offEdge = ts1.RPG > ts2.RPG ? name1 : ts2.RPG > ts1.RPG ? name2 : null;
    const defEdge = ts1.RAPG < ts2.RAPG ? name1 : ts2.RAPG < ts1.RAPG ? name2 : null;

    const t1Players = getTeamPlayers(t1 ? t1.id : game.homeTeamId).filter(p => p.seasonStats.AB > 0);
    const t2Players = getTeamPlayers(t2 ? t2.id : game.awayTeamId).filter(p => p.seasonStats.AB > 0);
    const topT1 = [...t1Players].sort((a,b) => b.seasonStats.H/b.seasonStats.AB - a.seasonStats.H/a.seasonStats.AB)[0];
    const topT2 = [...t2Players].sort((a,b) => b.seasonStats.H/b.seasonStats.AB - a.seasonStats.H/a.seasonStats.AB)[0];
    const rbiT1 = [...t1Players].sort((a,b) => b.seasonStats.BI - a.seasonStats.BI)[0];
    const rbiT2 = [...t2Players].sort((a,b) => b.seasonStats.BI - a.seasonStats.BI)[0];

    const fmt = v => v.toFixed(3).replace(/^0/,'');
    let html = '';

    // Paragraph 1: matchup overview
    const recStr1 = fmtRec(ts1), recStr2 = fmtRec(ts2);
    html += `<p><strong>${name1} (${recStr1}) vs. ${name2} (${recStr2})</strong> — `;
    if (ts1.G === 0 && ts2.G === 0) {
      html += `Both teams are yet to play this season, making this a true unknown. Everything is on the table.`;
    } else if (ts1.G === 0) {
      html += `${name1} hasn't played yet this season, while ${name2} enters at ${recStr2}. The ${name2} lineup has history to draw on; ${name1} is an open question.`;
    } else if (ts2.G === 0) {
      html += `${name2} hasn't played yet this season, while ${name1} enters at ${recStr1}. The ${name1} lineup has history to draw on; ${name2} is an open question.`;
    } else {
      const betterRec = ts1.W > ts2.W ? name1 : ts2.W > ts1.W ? name2 : null;
      if (betterRec) html += `${betterRec} enters with the better record, but in a league where any team can put up 15+ runs, records alone don't tell the full story.`;
      else html += `Both teams enter with identical records, setting up what should be a genuinely competitive matchup.`;
    }
    html += `</p>`;

    // Paragraph 2: offensive matchup
    if (ts1.G > 0 && ts2.G > 0) {
      html += `<p><strong>Offensive Matchup:</strong> `;
      if (avgEdge) {
        const other = avgEdge === name1 ? name2 : name1;
        const edgeAvg = avgEdge === name1 ? ts1.AVG : ts2.AVG;
        const otherAvg = avgEdge === name1 ? ts2.AVG : ts1.AVG;
        html += `${avgEdge} holds a clear edge at the plate, batting ${fmt(edgeAvg)} as a team compared to ${other}'s ${fmt(otherAvg)}. `;
      } else {
        html += `Both teams are hitting at a similar clip — this game could come down to who finds their timing early. `;
      }
      if (offEdge) {
        const edgeRPG = offEdge === name1 ? ts1.RPG : ts2.RPG;
        html += `${offEdge} has been the higher-scoring offense, averaging ${edgeRPG.toFixed(1)} runs per game. `;
      }
      if (topT1) html += `Watch ${displayName(topT1.name)} for ${name1} — batting ${fmt(topT1.seasonStats.H/topT1.seasonStats.AB)} this season, they've been the team's most consistent hitter. `;
      if (topT2) html += `${displayName(topT2.name)} fills that same role for ${name2} at ${fmt(topT2.seasonStats.H/topT2.seasonStats.AB)}.`;
      html += `</p>`;
    }

    // Paragraph 3: keys to winning
    html += `<p><strong>Keys to the Game:</strong> `;
    const keys = [];
    if (ts1.G > 0 && ts2.G > 0) {
      if (Math.abs(ts1.OPS - ts2.OPS) > 0.15) {
        const strongTeam = ts1.OPS > ts2.OPS ? name1 : name2;
        const weakTeam = strongTeam === name1 ? name2 : name1;
        keys.push(`${weakTeam} needs to manufacture runs even without big innings — they can't trade runs straight up with ${strongTeam}`);
      }
      if (rbiT1 && rbiT1.seasonStats.BI >= 3) keys.push(`${displayName(rbiT1.name)} (${rbiT1.seasonStats.BI} RBI) is ${name1}'s biggest run-producer — keeping them from big spots will be key`);
      if (rbiT2 && rbiT2.seasonStats.BI >= 3) keys.push(`${displayName(rbiT2.name)} (${rbiT2.seasonStats.BI} RBI) is ${name2}'s biggest run-producer — same deal on the other side`);
    }
    if (keys.length === 0) keys.push(`With limited game data available, first-inning momentum will be critical`, `Getting productive at-bats early sets the tone in slowpitch`);
    html += keys.join('; ') + '.</p>';

    return html;
  }

  // Show written analysis for all games in the next upcoming week
  const unplayed = DATA.games.filter(g => g.homeScore === undefined);
  const nextWeek = unplayed.length ? Math.min(...unplayed.map(g => g.week)) : null;
  const isNextGame = nextWeek !== null && game.week === nextWeek;

  // writePreview(ts1=away, ts2=home, t1=away, t2=home) — away listed first throughout
  const previewAnalysis = isNextGame ? writePreview(as_, hs, away, home) : null;

  document.getElementById('app').innerHTML = `
    <a class="back-link" href="#/schedule">&larr; Schedule</a>
    <div class="preview-header">
      <div class="preview-label">UPCOMING GAME &middot; WEEK ${game.week} &middot; ${fmtDate(game.date)}${game.location ? ' &middot; ' + game.location : ''}</div>
      <div class="preview-matchup">
        <div>
          <div class="preview-record">${fmtRec(as_)}</div>
          <div class="preview-team"><a href="#/team/${away ? away.id : ''}">${away ? teamLogoImg(away.id) + away.name : 'Away'}</a></div>
        </div>
        <div class="preview-vs">@</div>
        <div>
          <div class="preview-record">${fmtRec(hs)}</div>
          <div class="preview-team"><a href="#/team/${home ? home.id : ''}">${home ? teamLogoImg(home.id) + home.name : 'Home'}</a></div>
        </div>
      </div>
    </div>
    ${previewAnalysis ? `<div class="card">
      <div class="card-header">Preview</div>
      <div class="card-body padded" style="line-height:1.75">${previewAnalysis}</div>
    </div>` : ''}
    <div class="two-col">
      <div class="card">
        <div class="card-header">Team Comparison</div>
        <div class="card-body"><div class="table-wrap">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr>
              <th style="text-align:right;background:var(--mlb-blue)">${away ? teamLogoImg(away.id) + away.name : 'Away'}</th>
              <th style="text-align:center;background:#1a2a4a;width:110px">Stat</th>
              <th style="text-align:left;background:var(--mlb-red)">${home ? teamLogoImg(home.id) + home.name : 'Home'}</th>
            </tr></thead>
            <tbody>${cmpRows}</tbody>
          </table>
        </div></div>
      </div>
      <div class="card">
        <div class="card-header">Key Players to Watch</div>
        <div class="card-body">
          <div class="key-players-grid">
            <div class="key-player-col">
              <h4>${away ? away.name.toUpperCase() : 'AWAY'}</h4>
              ${keyPlayers(game.awayTeamId)}
            </div>
            <div class="key-player-col">
              <h4>${home ? home.name.toUpperCase() : 'HOME'}</h4>
              ${keyPlayers(game.homeTeamId)}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}
